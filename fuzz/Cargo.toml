# cargo-fuzz targets for Tally's untrusted-input parsers (docs/security.md §9).
#
# Its own workspace (the root Cargo.toml excludes `fuzz`), so the main
# workspace's stable builds, clippy, tests and cargo-deny never see
# libfuzzer-sys. Needs a nightly toolchain; from the repository root:
#
#     cargo +nightly fuzz run ods_parts fuzz/corpus/ods_parts fuzz/seeds/ods_parts -- -dict=fuzz/dict/ods.dict
#
# The harness functions live in crates/tally-fuzz-harness (stable), shared
# with the replay test that runs fuzz/regressions/ on every `cargo test`.

[package]
name = "tally-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
tally-fuzz-harness = { path = "../crates/tally-fuzz-harness" }

[workspace]
members = ["."]

[[bin]]
name = "ods"
path = "fuzz_targets/ods.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ods_parts"
path = "fuzz_targets/ods_parts.rs"
test = false
doc = false
bench = false

