# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run with `cargo deny check`. CI runs it in the rust-check job.

[graph]
all-features = true
# The platforms Tally ships for (.github/workflows/release.yml). Crates only
# other targets pull in are not checked: e.g. `webpki-root-certs`
# (CDLA-Permissive-2.0), which the updater's TLS stack (rustls-platform-
# verifier) uses on wasm32 only.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices (no known vulnerability) for crates we cannot
# replace ourselves. Re-check when the parents are upgraded.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro helper pulled in by Tauri's GTK stack" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: font parsing for fontdb / krilla (tally-io-pdf); no maintained drop-in yet" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: text shaping inside krilla (tally-io-pdf)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: D-Bus stack of Tauri's Linux dependencies" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: D-Bus stack of Tauri's Linux dependencies" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: D-Bus stack of Tauri's Linux dependencies" },
]

[licenses]
version = 2
# Permissive licences only. Anything not listed here is rejected, which
# includes GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1 and LGPL-3.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Tauri's HTML/CSS handling (cssparser, cssparser-macros, selectors,
    # dom_query and friends, through tauri-utils). Used unmodified as
    # dependencies; never copy MPL code into this repository.
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Our own workspace crates are `publish = false`; skip them.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Pinned to 2.x; the 3.0 alpha must never sneak in.
    { name = "tauri", version = ">=3.0.0-0" },
    # Pinned to 1.x; not the 2.0 beta.
    { name = "smallvec", version = ">=2.0.0-0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
