# TEXT conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "thousands"
formula = '=TEXT(1234.5;"#,##0.00")'
expect = "1,234.50"

[[case]]
name = "percent"
formula = '=TEXT(0.5;"0%")'
expect = "50%"

[[case]]
name = "iso date"
formula = '=TEXT(46314;"YYYY-MM-DD")'
expect = "2026-10-19"

[[case]]
name = "fixed decimals"
formula = '=TEXT(1.2345;"0.00")'
expect = "1.23"

[[case]]
name = "leading zeros"
formula = '=TEXT(7;"000")'
expect = "007"

[[case]]
name = "time"
formula = '=TEXT(0.75;"HH:MM")'
expect = "18:00"

[[case]]
name = "text passes through"
formula = '=TEXT("abc";"0.00")'
expect = "abc"

[[case]]
name = "boolean as number"
formula = '=TEXT(TRUE;"0")'
expect = "1"

[[case]]
name = "empty cell as zero"
formula = '=TEXT(A5;"0.0")'
expect = "0.0"

[[case]]
name = "cell reference"
cells = { A1 = 2.5 }
formula = '=TEXT(A1;"0.0")'
expect = "2.5"

[[case]]
name = "1904 epoch"
formula = '=TEXT(0;"YYYY-MM-DD")'
expect = "1904-01-01"
settings = { date_epoch = "1904" }

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = '=TEXT(A1;"0")'
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = '=TEXT(1)'
expect = "Err:511"
