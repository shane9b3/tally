# VALUE conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "plain"
formula = '=VALUE("12.5")'
expect = 12.5

[[case]]
name = "currency thousands"
formula = '=VALUE("$1,234.50")'
expect = 1234.5

[[case]]
name = "percent"
formula = '=VALUE("15%")'
expect = 0.15

[[case]]
name = "us date"
formula = '=VALUE("10/19/2026")'
expect = 46314

[[case]]
name = "iso date"
formula = '=VALUE("2026-10-19")'
expect = 46314

[[case]]
name = "time"
formula = '=VALUE("12:00")'
expect = 0.5
tol = 1e-12

[[case]]
name = "surrounding spaces"
formula = '=VALUE(" 7 ")'
expect = 7

[[case]]
name = "number passes through"
formula = '=VALUE(3)'
expect = 3

[[case]]
name = "boolean"
formula = '=VALUE(TRUE)'
expect = 1

[[case]]
name = "not a number"
formula = '=VALUE("abc")'
expect = "#VALUE!"

[[case]]
name = "empty text"
formula = '=VALUE("")'
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = '=VALUE(A1)'
expect = "#DIV/0!"

[[case]]
name = "cell text"
cells = { A1 = "1,234" }
formula = '=VALUE(A1)'
expect = 1234
