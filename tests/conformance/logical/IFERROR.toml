# IFERROR conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "error replaced"
formula = "=IFERROR(1/0;\"bad\")"
expect = "bad"

[[case]]
name = "value kept"
formula = "=IFERROR(5;\"bad\")"
expect = 5

[[case]]
name = "fallback lazy"
cells = {  }
formula = "=IFERROR(1;1/0)"
expect = 1
note = "The fallback is not evaluated when the value is fine."

[[case]]
name = "fallback error returned"
formula = "=IFERROR(1/0;NA())"
expect = "#N/A"

[[case]]
name = "cell error"
cells = { A1 = "=NA()" }
formula = "=IFERROR(A1;0)"
expect = 0

[[case]]
name = "cell value"
cells = { A1 = 3 }
formula = "=IFERROR(A1;0)"
expect = 3

[[case]]
name = "text cell kept"
cells = { A1 = "t" }
formula = "=IFERROR(A1;7)"
expect = "t"

[[case]]
name = "text value kept"
formula = "=IFERROR(\"x\";1)"
expect = "x"

[[case]]
name = "missing fallback"
formula = "=IFERROR(1/0;)"
expect = 0

[[case]]
name = "sum over reference fallback"
cells = { A1 = 1, A2 = 2 }
formula = "=SUM(IFERROR(1/0;A1:A2))"
expect = 3

[[case]]
name = "too few"
formula = "=IFERROR(1)"
expect = "Err:511"
