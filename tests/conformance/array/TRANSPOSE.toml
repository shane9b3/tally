# TRANSPOSE conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "2x3"
formula = "=TRANSPOSE({1;2;3|4;5;6})"
expect = [[1, 4], [2, 5], [3, 6]]

[[case]]
name = "row to column"
formula = "=TRANSPOSE({1;2;3})"
expect = [[1], [2], [3]]

[[case]]
name = "column to row"
formula = "=TRANSPOSE({1|2|3})"
expect = [[1, 2, 3]]

[[case]]
name = "scalar"
formula = "=TRANSPOSE(5)"
expect = [[5]]

[[case]]
name = "range"
cells = { A1 = 1, B1 = 2, A2 = 3, B2 = 4 }
origin = "F1"
formula = "=TRANSPOSE(A1:B2)"
expect = [[1, 3], [2, 4]]

[[case]]
name = "text kept"
cells = { A1 = "a", A2 = 2 }
formula = "=TRANSPOSE(A1:A2)"
expect = [["a", 2]]

[[case]]
name = "empty becomes 0"
cells = { A2 = 2 }
formula = "=TRANSPOSE(A1:A2)"
expect = [[0, 2]]

[[case]]
name = "boolean kept"
cells = { A1 = true, A2 = 2 }
formula = "=TRANSPOSE(A1:A2)"
expect = [[true, 2]]

[[case]]
name = "too many args"
formula = "=TRANSPOSE({1};{2})"
expect = "Err:504"

[[case]]
name = "no args"
formula = "=TRANSPOSE()"
expect = "Err:511"
