# MDETERM conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=MDETERM({1;2|3;4})"
expect = -2
tol = 1e-12

[[case]]
name = "1x1"
formula = "=MDETERM({7})"
expect = 7

[[case]]
name = "singular is 0"
formula = "=MDETERM({1;2|2;4})"
expect = 0

[[case]]
name = "3x3"
formula = "=MDETERM({2;0;1|1;3;2|1;1;1})"
expect = 0
tol = 1e-12

[[case]]
name = "3x3 nonzero"
formula = "=MDETERM({1;2;3|0;1;4|5;6;0})"
expect = 1
tol = 1e-12

[[case]]
name = "row swap sign"
formula = "=MDETERM({0;1|1;0})"
expect = -1

[[case]]
name = "not square"
formula = "=MDETERM({1;2;3})"
expect = "#VALUE!"

[[case]]
name = "text"
cells = { A1 = 1, B1 = 2, A2 = "x", B2 = 4 }
formula = "=MDETERM(A1:B2)"
expect = "#VALUE!"

[[case]]
name = "range with empty as 0"
cells = { A1 = 1, B1 = 2, B2 = 4 }
formula = "=MDETERM(A1:B2)"
expect = 4

[[case]]
name = "error propagates"
cells = { A1 = "=1/0", B1 = 2, A2 = 3, B2 = 4 }
formula = "=MDETERM(A1:B2)"
expect = "#DIV/0!"
