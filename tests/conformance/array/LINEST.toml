# LINEST conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "slope and intercept (columns)"
formula = "=LINEST({3|5|7|9};{1|2|3|4})"
expect = [[2, 1]]
tol = 1e-12

[[case]]
name = "rows"
formula = "=LINEST({3;5;7;9};{1;2;3;4})"
expect = [[2, 1]]
tol = 1e-12

[[case]]
name = "default x is 1..n"
formula = "=LINEST({3|5|7|9})"
expect = [[2, 1]]
tol = 1e-12

[[case]]
name = "const FALSE forces the line through the origin"
formula = "=LINEST({3|5|7|9};{1|2|3|4};FALSE)"
expect = [[2.3333333333333335, 0]]
tol = 1e-12

[[case]]
name = "stats block with #N/A padding"
formula = "=LINEST({1|3|2|5|4};{1|2|3|4|5};TRUE;TRUE)"
expect = [[0.8, 0.6], [0.3464101615137754, 1.1489125293076057], [0.64, 1.0954451150103321], [5.333333333333333, 3], [6.4, 3.6]]
tol = 1e-10

[[case]]
name = "two regressors, coefficients in reverse order"
cells = { A1 = 9, A2 = 8, A3 = 19, A4 = 18, A5 = 32, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5, C1 = 2, C2 = 1, C3 = 4, C4 = 3, C5 = 7 }
origin = "F1"
formula = "=LINEST(A1:A5;B1:C5)"
expect = [[3, 2, 1]]
tol = 1e-9
note = "y = 1 + 2*x1 + 3*x2 exactly (A3:A5 were 18/17/28, off the plane, in the first draft) gives {3, 2, 1} reversed: x2, x1, intercept."

[[case]]
name = "multi regressor stats has #N/A padding"
cells = { A1 = 9, A2 = 8, A3 = 18, A4 = 17, A5 = 28, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5, C1 = 2, C2 = 1, C3 = 4, C4 = 3, C5 = 7 }
origin = "F1"
formula = "=INDEX(LINEST(A1:A5;B1:C5;TRUE;TRUE);3;3)"
expect = "#N/A"

[[case]]
name = "collinear regressors"
cells = { A1 = 1, A2 = 2, A3 = 4, A4 = 3, B1 = 1, B2 = 2, B3 = 3, B4 = 4, C1 = 2, C2 = 4, C3 = 6, C4 = 8 }
origin = "F1"
formula = "=LINEST(A1:A4;B1:C4)"
expect = "Err:502"
note = "AOO: PushIllegalArgument for a rank-deficient X."

[[case]]
name = "text in y"
cells = { A1 = 1, A2 = "x", A3 = 3, B1 = 1, B2 = 2, B3 = 3 }
formula = "=LINEST(A1:A3;B1:B3)"
expect = "Err:502"

[[case]]
name = "too few samples"
formula = "=LINEST({1};{1})"
expect = "Err:502"

[[case]]
name = "shape mismatch"
formula = "=LINEST({1|2|3};{1|2})"
expect = "Err:502"

[[case]]
name = "constant x"
formula = "=LINEST({1|2|3};{4|4|4})"
expect = "Err:502"
