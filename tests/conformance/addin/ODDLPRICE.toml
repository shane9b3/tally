[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=ODDLPRICE(A4;DATE(2008;6;15);DATE(2007;10;15);0.0375;0.0405;100;2;0)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=ODDLPRICE(DATE(2008;2;7);DATE(2008;6;15);DATE(2007;10;15);0.0375;0.0405;100)"
expect = "Err:511"
