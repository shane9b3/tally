[[case]]
name = "frequency must be 1, 2 or 4"
formula = "=ODDLPRICE(DATE(2008;2;7);DATE(2008;6;15);DATE(2007;10;15);0.0375;0.0405;100;3;0)"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=ODDLPRICE(DATE(2008;6;15);DATE(2008;2;7);DATE(2007;10;15);0.0375;0.0405;100;2;0)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=ODDLPRICE(\"x\";DATE(2008;6;15);DATE(2007;10;15);0.0375;0.0405;100;2;0)"
