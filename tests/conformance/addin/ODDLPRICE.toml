# ODDLPRICE conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=ODDLPRICE(DATE(2008;2;7);DATE(2008;6;15);DATE(2007;10;15);0.0375;0.0405;100;2;0)"
expect = 99.87829
tol = 1e-05

[[case]]
name = "basis omitted"
formula = "=ODDLPRICE(DATE(2008;2;7);DATE(2008;6;15);DATE(2007;10;15);0.0375;0.0405;100;2)"
expect = 99.87829
tol = 1e-05

[[case]]
name = "last interest must precede settlement"
formula = "=ODDLPRICE(DATE(2008;2;7);DATE(2008;6;15);DATE(2008;2;7);0.0375;0.0405;100;2)"
expect = "Err:502"

[[case]]
name = "negative yield"
formula = "=ODDLPRICE(DATE(2008;2;7);DATE(2008;6;15);DATE(2007;10;15);0.0375;-0.01;100;2)"
expect = "Err:502"

[[case]]
name = "basis 0"
formula = "=ODDLPRICE(DATE(2008;2;7);DATE(2008;6;15);DATE(2007;10;15);0.0375;0.0405;100;2;0)"
expect = 99.8782860147213
tol = 1e-09

