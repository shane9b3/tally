# NOMINAL_ADD conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx). Registered under the programmatic ODF name; plain NOMINAL means the built-in.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=NOMINAL_ADD(0.053543;4)"
expect = 0.0525
tol = 1e-06

[[case]]
name = "inverse of EFFECT_ADD"
formula = "=NOMINAL_ADD(EFFECT_ADD(0.08;12);12)"
expect = 0.08
tol = 1e-12

[[case]]
name = "periods truncated"
formula = "=NOMINAL_ADD(0.1;4.9)"
expect = 0.0964547563377804
tol = 1e-09

[[case]]
name = "zero periods (non-finite result)"
formula = "=NOMINAL_ADD(0.1;0)"
expect = "Err:502"
note = "AOO only rejects periods < 0; 0 gives a non-finite result, which is Err:502."

[[case]]
name = "rate must be positive"
formula = "=NOMINAL_ADD(0;4)"
expect = "Err:502"

[[case]]
name = "negative periods"
formula = "=NOMINAL_ADD(0.1;-1)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=NOMINAL_ADD(\"x\";4)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=NOMINAL_ADD(A4;4)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=NOMINAL_ADD(0.1)"
expect = "Err:511"
