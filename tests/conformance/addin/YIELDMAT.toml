formula = "=YIELDMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;8);0.0625;100;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=YIELDMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;8);0.0625;100;\"\")"
expect = 0.0614649137783845
tol = 1e-09

[[case]]
name = "non-numeric text basis"
formula = "=YIELDMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;8);0.0625;100;\"x\")"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=YIELDMAT(DATE(2008;5;15);DATE(2008;2;15);DATE(2007;11;8);0.0625;100;0)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=YIELDMAT(\"x\";DATE(2008;5;15);DATE(2007;11;8);0.0625;100;0)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=YIELDMAT(A4;DATE(2008;5;15);DATE(2007;11;8);0.0625;100;0)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=YIELDMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;8);0.0625)"
expect = "Err:511"
