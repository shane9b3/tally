# YIELDMAT conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=YIELDMAT(DATE(2008;3;15);DATE(2008;11;3);DATE(2007;11;8);0.0625;100.0123;0)"
expect = 0.060954
tol = 1e-06

[[case]]
name = "basis omitted"
formula = "=YIELDMAT(DATE(2008;3;15);DATE(2008;11;3);DATE(2007;11;8);0.0625;100.0123)"
expect = 0.060954
tol = 1e-06

[[case]]
name = "rate must be positive"
formula = "=YIELDMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;8);0;100)"
expect = "Err:502"

[[case]]
name = "zero price is not checked (AOO)"
formula = "=YIELDMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;8);0.06;0)"
expect = 251.134020618557
tol = 1e-09
note = "AOO only checks the rate and the dates."

[[case]]
name = "basis 0"
formula = "=YIELDMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;8);0.0625;100;0)"
expect = 0.0614649137783845
tol = 1e-09

[[case]]
name = "basis 1"
formula = "=YIELDMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;8);0.0625;100;1)"
expect = 0.0616265364539487
tol = 1e-09

[[case]]
name = "basis 2"
formula = "=YIELDMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;8);0.0625;100;2)"
expect = 0.0614439324116747
