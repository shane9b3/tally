# PRICEDISC conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=PRICEDISC(DATE(2008;2;16);DATE(2008;3;1);0.0525;100;2)"
expect = 99.79583333
tol = 1e-08

[[case]]
name = "basis omitted"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05;100)"
expect = 98.7638888888889
tol = 1e-09

[[case]]
name = "discount must be positive"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0;100)"
expect = "Err:502"

[[case]]
name = "redemption must be positive"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05;0)"
expect = "Err:502"

[[case]]
name = "basis 0"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05;100;0)"
expect = 98.7638888888889
tol = 1e-09

[[case]]
name = "basis 1"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05;100;1)"
expect = 98.7704918032787
tol = 1e-09

[[case]]
name = "basis 2"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05;100;2)"
expect = 98.75
tol = 1e-09

[[case]]
name = "basis 3"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05;100;3)"
expect = 98.7671232876712
tol = 1e-09

[[case]]
name = "basis 4"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05;100;4)"
expect = 98.75
tol = 1e-09

[[case]]
name = "basis 5 is illegal"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05;100;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05;100;\"\")"
expect = 98.7638888888889
tol = 1e-09

[[case]]
name = "non-numeric text basis"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05;100;\"x\")"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=PRICEDISC(DATE(2008;5;15);DATE(2008;2;15);0.05;100;2)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=PRICEDISC(\"x\";DATE(2008;5;15);0.05;100;2)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=PRICEDISC(A4;DATE(2008;5;15);0.05;100;2)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=PRICEDISC(DATE(2008;2;15);DATE(2008;5;15);0.05)"
expect = "Err:511"
