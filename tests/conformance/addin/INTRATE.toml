# INTRATE conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;1014420;2)"
expect = 0.05768
tol = 1e-12

[[case]]
name = "basis omitted"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;1014420)"
expect = 0.0583280898876408
tol = 1e-09

[[case]]
name = "investment must be positive"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);0;1014420;2)"
expect = "Err:502"

[[case]]
name = "redemption must be positive"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;-1;2)"
expect = "Err:502"

[[case]]
name = "basis 0"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;1014420;0)"
expect = 0.0583280898876408
tol = 1e-09

[[case]]
name = "basis 1"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;1014420;1)"
expect = 0.0586413333333337
tol = 1e-09

[[case]]
name = "basis 2"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;1014420;2)"
expect = 0.0576800000000004
tol = 1e-09

[[case]]
name = "basis 3"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;1014420;3)"
expect = 0.0584811111111115
tol = 1e-09

[[case]]
name = "basis 4"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;1014420;4)"
expect = 0.0576800000000004
tol = 1e-09

[[case]]
name = "basis 5 is illegal"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;1014420;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;1014420;\"\")"
expect = 0.0583280898876408
tol = 1e-09

[[case]]
name = "non-numeric text basis"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000;1014420;\"x\")"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=INTRATE(DATE(2008;5;15);DATE(2008;2;15);1000000;1014420;2)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=INTRATE(\"x\";DATE(2008;5;15);1000000;1014420;2)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=INTRATE(A4;DATE(2008;5;15);1000000;1014420;2)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=INTRATE(DATE(2008;2;15);DATE(2008;5;15);1000000)"
expect = "Err:511"
