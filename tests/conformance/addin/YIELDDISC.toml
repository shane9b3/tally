# YIELDDISC conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=YIELDDISC(DATE(2008;2;16);DATE(2008;3;1);99.795;100;2)"
expect = 0.052823
tol = 1e-06

[[case]]
name = "basis omitted"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99;100)"
expect = 0.0404040404040407
tol = 1e-09

[[case]]
name = "price must be positive"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);0;100)"
expect = "Err:502"

[[case]]
name = "redemption must be positive"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99;0)"
expect = "Err:502"

[[case]]
name = "basis 0"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99;100;0)"
expect = 0.0404040404040407
tol = 1e-09

[[case]]
name = "basis 1"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99;100;1)"
expect = 0.0410774410774413
tol = 1e-09

[[case]]
name = "basis 2"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99;100;2)"
expect = 0.0404040404040407
tol = 1e-09

[[case]]
name = "basis 3"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99;100;3)"
expect = 0.0409652076318746
tol = 1e-09

[[case]]
name = "basis 4"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99;100;4)"
expect = 0.0404040404040407
tol = 1e-09

[[case]]
name = "basis 5 is illegal"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99;100;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99;100;\"\")"
expect = 0.0404040404040407
tol = 1e-09

[[case]]
name = "non-numeric text basis"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99;100;\"x\")"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=YIELDDISC(DATE(2008;5;15);DATE(2008;2;15);99;100;2)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=YIELDDISC(\"x\";DATE(2008;5;15);99;100;2)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=YIELDDISC(A4;DATE(2008;5;15);99;100;2)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=YIELDDISC(DATE(2008;2;15);DATE(2008;5;15);99)"
expect = "Err:511"
