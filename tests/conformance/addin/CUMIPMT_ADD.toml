# CUMIPMT_ADD conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx). Registered under the programmatic ODF name; plain CUMIPMT means the built-in.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=CUMIPMT_ADD(0.09/12;30*12;125000;13;24;0)"
expect = -11135.23213
tol = 1e-05

[[case]]
name = "advance"
formula = "=CUMIPMT_ADD(0.09/12;30*12;125000;13;24;1)"
expect = -11052.3395838718
tol = 1.10523395838718e-08

[[case]]
name = "first period"
formula = "=CUMIPMT_ADD(0.09/12;360;125000;1;1;0)"
expect = -937.5
tol = 1e-09

[[case]]
name = "agrees with the built-in"
formula = "=CUMIPMT_ADD(0.09/12;360;125000;13;24;0)-CUMIPMT(0.09/12;360;125000;13;24;0)"
expect = 0
tol = 1e-06

[[case]]
name = "type must be 0 or 1"
formula = "=CUMIPMT_ADD(0.09/12;360;125000;13;24;2)"
expect = "Err:502"

[[case]]
name = "rate must be positive"
formula = "=CUMIPMT_ADD(0;360;125000;13;24;0)"
expect = "Err:502"

[[case]]
name = "end before start"
formula = "=CUMIPMT_ADD(0.01;360;125000;25;24;0)"
expect = "Err:502"

[[case]]
name = "end beyond nper"
formula = "=CUMIPMT_ADD(0.01;360;125000;1;361;0)"
expect = "Err:502"

[[case]]
name = "pv must be positive"
formula = "=CUMIPMT_ADD(0.01;360;0;1;12;0)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=CUMIPMT_ADD(\"x\";360;125000;1;12;0)"
expect = "#VALUE!"

[[case]]
name = "too few arguments"
formula = "=CUMIPMT_ADD(0.01;360;125000;1;12)"
expect = "Err:511"
