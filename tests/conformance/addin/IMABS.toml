# IMABS conformance vectors. Ported from Apache OpenOffice analysishelper.cxx. Schema: docs/contributing-functions.md.

[[case]]
formula = "=IMABS(\"3+4i\")"
expect = 5.0
tol = 1e-12

[[case]]
formula = "=IMABS(\"3+4j\")"
expect = 5.0
tol = 1e-12

[[case]]
formula = "=IMABS(\"i\")"
expect = 1.0
tol = 1e-12

[[case]]
formula = "=IMABS(\"-i\")"
expect = 1.0
tol = 1e-12

[[case]]
formula = "=IMABS(\"5\")"
expect = 5.0
tol = 1e-12

[[case]]
formula = "=IMABS(\"1e2+3.5e-1i\")"
expect = 100.00061249812423
tol = 1e-12

[[case]]
formula = "=IMABS(\"0\")"
expect = 0.0
tol = 1e-12

[[case]]
formula = "=IMABS(\"-3-4i\")"
expect = 5.0
tol = 1e-12

[[case]]
formula = "=IMABS(\"1+2\")"
expect = "Err:502"

[[case]]
formula = "=IMABS(\"3+4i\";1)"
expect = "Err:504"

[[case]]
formula = "=IMABS()"
expect = "Err:511"

[[case]]
cells = { A1 = "=1/0" }
formula = "=IMABS(A1)"
expect = "#DIV/0!"

[[case]]
name = "text cell"
cells = { A1 = "3+4i" }
formula = "=IMABS(A1)"
expect = 5.0
tol = 1e-12

[[case]]
name = "number cell"
cells = { A1 = 3 }
formula = "=IMABS(A1)"
expect = 3.0
tol = 1e-12

