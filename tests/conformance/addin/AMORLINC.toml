# AMORLINC conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);300;1;0.15;1)"
expect = 360

[[case]]
name = "period 0"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);300;0;0.15;1)"
expect = 131.803278688525
tol = 1e-09

[[case]]
name = "period 3"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);300;3;0.15;1)"
expect = 360

[[case]]
name = "after the asset is written off"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);300;7;0.15;1)"
expect = 0

[[case]]
name = "basis 0"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);300;1;0.15;0)"
expect = 360

[[case]]
name = "basis 2 is not allowed"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);300;1;0.15;2)"
expect = "Err:502"

[[case]]
name = "basis 5 is illegal"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);300;1;0.15;5)"
expect = "Err:502"

[[case]]
name = "rate must be positive"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);300;1;0;1)"
expect = "Err:502"

[[case]]
name = "purchase after first period"
formula = "=AMORLINC(2400;DATE(2009;8;19);DATE(2008;12;31);300;1;0.15;1)"
expect = "Err:502"

[[case]]
name = "salvage above cost"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);3000;1;0.15;1)"
expect = "Err:502"

[[case]]
name = "basis omitted"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);300;1;0.15)"
expect = 360

[[case]]
name = "non-numeric text"
formula = "=AMORLINC(\"x\";DATE(2008;8;19);DATE(2008;12;31);300;1;0.15)"
expect = "#VALUE!"

[[case]]
name = "too few arguments"
formula = "=AMORLINC(2400;DATE(2008;8;19);DATE(2008;12;31);300;1)"
expect = "Err:511"
