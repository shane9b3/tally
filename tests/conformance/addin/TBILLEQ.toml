# TBILLEQ conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=TBILLEQ(DATE(2008;3;31);DATE(2008;6;1);0.0914)"
expect = 0.094151
tol = 1e-06

[[case]]
name = "longer bill"
formula = "=TBILLEQ(DATE(2008;3;31);DATE(2008;12;31);0.05)"
expect = 0.0526771539904748
tol = 1e-09

[[case]]
name = "more than 360 days (30/360)"
formula = "=TBILLEQ(DATE(2008;3;31);DATE(2009;4;1);0.05)"
expect = "Err:502"

[[case]]
name = "discount must be positive"
formula = "=TBILLEQ(DATE(2008;3;31);DATE(2008;6;1);0)"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=TBILLEQ(DATE(2008;6;1);DATE(2008;3;31);0.05)"
expect = "Err:502"

[[case]]
name = "ISO date text"
formula = "=TBILLEQ(\"2008-03-31\";\"2008-06-01\";0.0914)"
expect = 0.094151
tol = 1e-06

[[case]]
name = "non-numeric text"
formula = "=TBILLEQ(\"x\";DATE(2008;6;1);0.05)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=TBILLEQ(A4;DATE(2008;6;1);0.05)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=TBILLEQ(DATE(2008;3;31);DATE(2008;6;1))"
expect = "Err:511"
