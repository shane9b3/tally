# PRICE conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;2;0)"
expect = 94.63436162
tol = 1e-08

[[case]]
name = "basis omitted"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;2)"
expect = 94.63436162
tol = 1e-08

[[case]]
name = "quarterly"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;4;1)"
expect = 94.6150939521378
tol = 1e-09

[[case]]
name = "zero coupon, zero yield"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0;0;100;1;0)"
expect = 100
tol = 1e-09

[[case]]
name = "negative yield"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;-0.01;100;2)"
expect = "Err:502"

[[case]]
name = "redemption must be positive"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;0;2)"
expect = "Err:502"

[[case]]
name = "basis 0"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;2;0)"
expect = 94.6343616213221
tol = 1e-09

[[case]]
name = "basis 1"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;2;1)"
expect = 94.6354492078772
tol = 1e-09

[[case]]
name = "basis 2"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;2;2)"
expect = 94.6024171768777
tol = 1e-09

[[case]]
name = "basis 3"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;2;3)"
expect = 94.643594548258
tol = 1e-09

[[case]]
name = "basis 4"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;2;4)"
expect = 94.6343616213221
tol = 1e-09

[[case]]
name = "basis 5 is illegal"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;2;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;2;\"\")"
expect = 94.6343616213221
tol = 1e-09

[[case]]
name = "non-numeric text basis"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;2;\"x\")"
expect = "Err:502"

[[case]]
name = "frequency must be 1, 2 or 4"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100;3;0)"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=PRICE(DATE(2017;11;15);DATE(2008;2;15);0.0575;0.065;100;2;0)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=PRICE(\"x\";DATE(2017;11;15);0.0575;0.065;100;2;0)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=PRICE(A4;DATE(2017;11;15);0.0575;0.065;100;2;0)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=PRICE(DATE(2008;2;15);DATE(2017;11;15);0.0575;0.065;100)"
expect = "Err:511"
