# DISC conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=DISC(DATE(2007;1;25);DATE(2007;6;15);97.975;100;1)"
expect = 0.05242
tol = 1e-06

[[case]]
name = "basis omitted"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97;100)"
expect = 0.12
tol = 1e-09

[[case]]
name = "price must be positive"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);0;100)"
expect = "Err:502"

[[case]]
name = "redemption must be positive"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97;0)"
expect = "Err:502"

[[case]]
name = "basis 0"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97;100;0)"
expect = 0.12
tol = 1e-09

[[case]]
name = "basis 1"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97;100;1)"
expect = 0.122
tol = 1e-09

[[case]]
name = "basis 2"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97;100;2)"
expect = 0.12
tol = 1e-09

[[case]]
name = "basis 3"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97;100;3)"
expect = 0.121666666666667
tol = 1e-09

[[case]]
name = "basis 4"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97;100;4)"
expect = 0.12
tol = 1e-09

[[case]]
name = "basis 5 is illegal"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97;100;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97;100;\"\")"
expect = 0.12
tol = 1e-09

[[case]]
name = "non-numeric text basis"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97;100;\"x\")"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=DISC(DATE(2008;5;15);DATE(2008;2;15);97;100;1)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=DISC(\"x\";DATE(2008;5;15);97;100;1)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=DISC(A4;DATE(2008;5;15);97;100;1)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=DISC(DATE(2008;2;15);DATE(2008;5;15);97)"
expect = "Err:511"
