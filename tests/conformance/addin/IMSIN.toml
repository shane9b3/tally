# IMSIN conformance vectors. Ported from Apache OpenOffice analysishelper.cxx. Schema: docs/contributing-functions.md.

[[case]]
formula = "=IMREAL(IMSIN(\"1+i\"))"
expect = 1.2984575814159773
tol = 1.2984575814159773e-11

[[case]]
formula = "=IMAGINARY(IMSIN(\"1+i\"))"
expect = 0.6349639147847361
tol = 1e-11

[[case]]
formula = "=IMREAL(IMSIN(\"3+4i\"))"
