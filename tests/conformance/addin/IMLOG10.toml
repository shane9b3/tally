[[case]]
formula = "=IMAGINARY(IMLOG10(\"2\"))"
expect = 0.0
tol = 1e-11

[[case]]
formula = "=IMREAL(IMLOG10(\"-i\"))"
expect = 0.0
tol = 1e-11

[[case]]
formula = "=IMAGINARY(IMLOG10(\"-i\"))"
expect = -0.6821881769209206
