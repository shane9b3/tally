# IMLOG10 conformance vectors. Ported from Apache OpenOffice analysishelper.cxx. Schema: docs/contributing-functions.md.

[[case]]
formula = "=IMREAL(IMLOG10(\"1+i\"))"
expect = 0.15051499783199057
tol = 1e-11

[[case]]
formula = "=IMAGINARY(IMLOG10(\"1+i\"))"
expect = 0.3410940884604603
tol = 1e-11

[[case]]
formula = "=IMREAL(IMLOG10(\"3+4i\"))"
expect = 0.6989700043360187
tol = 1e-11

[[case]]
formula = "=IMAGINARY(IMLOG10(\"3+4i\"))"
expect = 0.4027191962733731
tol = 1e-11

[[case]]
formula = "=IMREAL(IMLOG10(\"2-3j\"))"
expect = 0.5569716761534184
tol = 1e-11

[[case]]
formula = "=IMAGINARY(IMLOG10(\"2-3j\"))"
expect = -0.42682189085546657
tol = 1e-11

[[case]]
formula = "=IMREAL(IMLOG10(\"-0.5+0.25i\"))"
expect = -0.25257498915995297
