[[case]]
formula = "=IMLOG10(\"100\")"
expect = "2"

[[case]]
formula = "=IMLOG10(\"1000\")"
expect = "3"

[[case]]
formula = "=IMLOG10(\"abc\")"
expect = "Err:502"

[[case]]
formula = "=IMLOG10()"
expect = "Err:511"

[[case]]
cells = { A1 = "=1/0" }
formula = "=IMLOG10(A1)"
expect = "#DIV/0!"

[[case]]
formula = "=IMLOG10(\"0\")"
expect = "Err:502"
note = "AOO: IllegalArgumentException"

[[case]]
name = "number argument"
formula = "=IMREAL(IMLOG10(2))"
expect = 0.30102999566398114
tol = 1e-11

