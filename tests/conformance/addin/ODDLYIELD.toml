[[case]]
name = "non-numeric text basis"
formula = "=ODDLYIELD(DATE(2008;4;20);DATE(2008;6;15);DATE(2007;12;24);0.0375;99.875;100;2;\"x\")"
expect = "Err:502"

[[case]]
name = "frequency must be 1, 2 or 4"
formula = "=ODDLYIELD(DATE(2008;4;20);DATE(2008;6;15);DATE(2007;12;24);0.0375;99.875;100;3;0)"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=ODDLYIELD(DATE(2008;6;15);DATE(2008;4;20);DATE(2007;12;24);0.0375;99.875;100;2;0)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=ODDLYIELD(\"x\";DATE(2008;6;15);DATE(2007;12;24);0.0375;99.875;100;2;0)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=ODDLYIELD(A4;DATE(2008;6;15);DATE(2007;12;24);0.0375;99.875;100;2;0)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=ODDLYIELD(DATE(2008;4;20);DATE(2008;6;15);DATE(2007;12;24);0.0375;99.875;100)"
expect = "Err:511"
