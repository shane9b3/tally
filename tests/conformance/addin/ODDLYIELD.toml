# ODDLYIELD conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=ODDLYIELD(DATE(2008;4;20);DATE(2008;6;15);DATE(2007;12;24);0.0375;99.875;100;2;0)"
expect = 0.0451922
tol = 1e-06

[[case]]
name = "inverse of ODDLPRICE"
formula = "=ODDLYIELD(DATE(2008;2;7);DATE(2008;6;15);DATE(2007;10;15);0.0375;ODDLPRICE(DATE(2008;2;7);DATE(2008;6;15);DATE(2007;10;15);0.0375;0.0405;100;2;0);100;2;0)"
expect = 0.0405
tol = 1e-12

[[case]]
name = "price must be positive"
formula = "=ODDLYIELD(DATE(2008;4;20);DATE(2008;6;15);DATE(2007;12;24);0.0375;0;100;2)"
expect = "Err:502"

[[case]]
name = "last interest must precede settlement"
formula = "=ODDLYIELD(DATE(2008;4;20);DATE(2008;6;15);DATE(2008;4;20);0.0375;99;100;2)"
expect = "Err:502"

[[case]]
name = "basis 0"
formula = "=ODDLYIELD(DATE(2008;4;20);DATE(2008;6;15);DATE(2007;12;24);0.0375;99.875;100;2;0)"
expect = 0.045192235629169
tol = 1e-09

[[case]]
name = "basis 1"
formula = "=ODDLYIELD(DATE(2008;4;20);DATE(2008;6;15);DATE(2007;12;24);0.0375;99.875;100;2;1)"
expect = 0.0452800396859017
