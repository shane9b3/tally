[[case]]
name = "basis 2"
formula = "=ODDLYIELD(DATE(2008;4;20);DATE(2008;6;15);DATE(2007;12;24);0.0375;99.875;100;2;2)"
expect = 0.0450384151187782
tol = 1e-09

[[case]]
name = "basis 3"
formula = "=ODDLYIELD(DATE(2008;4;20);DATE(2008;6;15);DATE(2007;12;24);0.0375;99.875;100;2;3)"
expect = 0.0451563237304758
