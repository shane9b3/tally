# WEEKNUM_ADD conformance vectors. Analysis add-in WEEKNUM(date; mode); week 1 contains January 1. The plain name WEEKNUM is the built-in. Schema: docs/contributing-functions.md.

[[case]]
formula = "=WEEKNUM_ADD(DATE(2026;1;1);1)"
expect = 1

[[case]]
formula = "=WEEKNUM_ADD(DATE(2026;1;3);1)"
expect = 1

[[case]]
formula = "=WEEKNUM_ADD(DATE(2026;1;4);1)"
expect = 2

[[case]]
formula = "=WEEKNUM_ADD(DATE(2026;1;4);2)"
expect = 1

[[case]]
formula = "=WEEKNUM_ADD(DATE(2026;1;5);2)"
expect = 2

[[case]]
formula = "=WEEKNUM_ADD(DATE(2026;12;31);1)"
expect = 53

[[case]]
name = "Sunday January 1"
formula = "=WEEKNUM_ADD(DATE(2023;1;1);1)"
expect = 1

[[case]]
formula = "=WEEKNUM_ADD(DATE(2023;1;1);2)"
expect = 1

[[case]]
formula = "=WEEKNUM_ADD(DATE(2023;1;2);2)"
expect = 2

[[case]]
name = "mode out of range"
formula = "=WEEKNUM_ADD(DATE(2026;1;1);3)"
expect = "Err:502"

[[case]]
formula = "=WEEKNUM_ADD(\"x\";1)"
expect = "#VALUE!"

[[case]]
formula = "=WEEKNUM_ADD(1)"
expect = "Err:511"
