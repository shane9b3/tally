# BIN2OCT conformance vectors. Analysis add-in; 10-digit two's complement. Schema: docs/contributing-functions.md.

[[case]]
formula = "=BIN2OCT(\"1111111111\")"
expect = "7777777777"

[[case]]
formula = "=BIN2OCT(\"111\")"
expect = "7"

[[case]]
formula = "=BIN2OCT(\"111111\";4)"
expect = "0077"

[[case]]
formula = "=BIN2OCT(\"1000000000\")"
expect = "7777777000"

[[case]]
formula = "=BIN2OCT(\"0\")"
expect = "0"

[[case]]
formula = "=BIN2OCT(\"1000\")"
expect = "10"

[[case]]
formula = "=BIN2OCT(\"1000\";1)"
expect = "Err:502"

[[case]]
formula = "=BIN2OCT(\"9\")"
expect = "Err:502"

[[case]]
formula = "=BIN2OCT(\"111\";0)"
expect = "Err:502"

[[case]]
formula = "=BIN2OCT()"
expect = "Err:511"
