[[case]]
formula = "=IMCOT(\"abc\")"
expect = "Err:502"

[[case]]
formula = "=IMCOT()"
expect = "Err:511"

[[case]]
cells = { A1 = "=1/0" }
formula = "=IMCOT(A1)"
expect = "#DIV/0!"

[[case]]
formula = "=IMCOT(\"0\")"
expect = "Err:502"
note = "AOO: IllegalArgumentException"

[[case]]
name = "number argument"
