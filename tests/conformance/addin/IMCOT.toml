# IMCOT conformance vectors. Ported from Apache OpenOffice analysishelper.cxx. Schema: docs/contributing-functions.md.

[[case]]
formula = "=IMREAL(IMCOT(\"1+i\"))"
expect = 0.2176215618544028
tol = 1e-11

[[case]]
formula = "=IMAGINARY(IMCOT(\"1+i\"))"
