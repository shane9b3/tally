# DEC2BIN conformance vectors. Analysis add-in; 10-digit two's complement. Schema: docs/contributing-functions.md.

[[case]]
formula = "=DEC2BIN(-1)"
expect = "1111111111"

[[case]]
formula = "=DEC2BIN(5)"
expect = "101"

[[case]]
formula = "=DEC2BIN(5;8)"
expect = "00000101"

[[case]]
formula = "=DEC2BIN(511)"
expect = "111111111"

[[case]]
formula = "=DEC2BIN(-512)"
expect = "1000000000"

[[case]]
formula = "=DEC2BIN(0)"
expect = "0"

[[case]]
formula = "=DEC2BIN(512)"
expect = "Err:502"

[[case]]
formula = "=DEC2BIN(-513)"
expect = "Err:502"

[[case]]
formula = "=DEC2BIN(5;2)"
expect = "Err:502"

[[case]]
name = "places ignored for negative"
formula = "=DEC2BIN(-1;3)"
expect = "1111111111"

[[case]]
name = "truncated"
formula = "=DEC2BIN(5.9)"
expect = "101"

[[case]]
formula = "=DEC2BIN(\"x\")"
expect = "#VALUE!"

[[case]]
formula = "=DEC2BIN()"
expect = "Err:511"
