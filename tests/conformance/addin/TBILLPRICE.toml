# TBILLPRICE conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=TBILLPRICE(DATE(2008;3;31);DATE(2008;6;1);0.09)"
expect = 98.45
tol = 1e-09

[[case]]
name = "longer bill"
formula = "=TBILLPRICE(DATE(2008;3;31);DATE(2008;12;31);0.05)"
expect = 96.2361111111111
tol = 1e-09

[[case]]
name = "same day is allowed"
formula = "=TBILLPRICE(DATE(2008;3;31);DATE(2008;3;31);0.05)"
expect = 99.9861111111111
tol = 1e-09

[[case]]
name = "exactly one 30/360 year"
formula = "=TBILLPRICE(DATE(2008;1;1);DATE(2008;12;30);0.05)"
expect = "Err:502"

[[case]]
name = "discount must be positive"
formula = "=TBILLPRICE(DATE(2008;3;31);DATE(2008;6;1);0)"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=TBILLPRICE(DATE(2008;6;1);DATE(2008;3;31);0.05)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=TBILLPRICE(\"x\";DATE(2008;6;1);0.05)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=TBILLPRICE(A4;DATE(2008;6;1);0.05)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=TBILLPRICE(DATE(2008;3;31);DATE(2008;6;1))"
expect = "Err:511"
