# ACCRINT conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx). The first_interest argument is ignored, as in AOO 4.1.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;0)"
expect = 16.666667
tol = 1e-06

[[case]]
name = "par omitted is 1000"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;;2)"
expect = 16.6666666666667
tol = 1e-09

[[case]]
name = "empty text par is 1000"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;\"\";2)"
expect = 16.6666666666667
tol = 1e-09

[[case]]
name = "par 500"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;500;2)"
expect = 8.33333333333333
tol = 1e-09

[[case]]
name = "first interest ignored"
formula = "=ACCRINT(DATE(2008;3;1);0;DATE(2008;5;1);0.1;1000;2;0)"
expect = 16.666667
tol = 1e-06

[[case]]
name = "rate must be positive"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0;1000;2)"
expect = "Err:502"

[[case]]
name = "par must be positive"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;-1;2)"
expect = "Err:502"

[[case]]
name = "basis 0"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;0)"
expect = 16.6666666666667
tol = 1e-09

[[case]]
name = "basis 1"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;1)"
expect = 16.6666666666667
tol = 1e-09

[[case]]
name = "basis 2"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;2)"
expect = 16.9444444444444
tol = 1e-09

[[case]]
name = "basis 3"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;3)"
expect = 16.7123287671233
tol = 1e-09

[[case]]
name = "basis 4"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;4)"
expect = 16.6666666666667
tol = 1e-09

[[case]]
name = "basis 5 is illegal"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;\"\")"
expect = 16.6666666666667
tol = 1e-09

[[case]]
name = "non-numeric text basis"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;\"x\")"
expect = "Err:502"

[[case]]
name = "frequency must be 1, 2 or 4"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1;1000;3;0)"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=ACCRINT(DATE(2008;5;1);DATE(2008;8;31);DATE(2008;3;1);0.1;1000;2;0)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=ACCRINT(\"x\";DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;0)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=ACCRINT(A4;DATE(2008;8;31);DATE(2008;5;1);0.1;1000;2;0)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=ACCRINT(DATE(2008;3;1);DATE(2008;8;31);DATE(2008;5;1);0.1)"
expect = "Err:511"
