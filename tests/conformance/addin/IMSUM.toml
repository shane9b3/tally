# IMSUM conformance vectors. Ported from Apache OpenOffice analysishelper.cxx. Schema: docs/contributing-functions.md.

[[case]]
formula = "=IMSUM(\"3+4i\";\"-3-4i\")"
expect = "0"

[[case]]
formula = "=IMSUM(\"1+2i\";\"3+4i\")"
expect = "4+6i"

[[case]]
formula = "=IMSUM(\"1+2i\";\"3+4i\";\"5\")"
expect = "9+6i"

[[case]]
formula = "=IMSUM(\"1+2j\";\"3\")"
expect = "4+2j"

[[case]]
formula = "=IMSUM(\"i\")"
expect = "i"

[[case]]
formula = "=IMSUM(2;\"i\")"
expect = "2+i"

[[case]]
formula = "=IMSUM(\"1+2i\";\"3+4j\")"
expect = "Err:502"

[[case]]
formula = "=IMSUM(\"x\";\"1\")"
expect = "Err:502"

[[case]]
formula = "=IMSUM(\"1\";\"-i\")"
expect = "1-i"

[[case]]
formula = "=IMSUM()"
expect = "Err:511"

[[case]]
name = "range with number and empty cell"
cells = { A1 = "1+i", A2 = 2, A4 = "3-4i" }
formula = "=IMSUM(A1:A4)"
expect = "6-3i"

[[case]]
cells = { A1 = "1+i", A2 = "=1/0" }
formula = "=IMSUM(A1:A2;\"1\")"
expect = "#DIV/0!"

[[case]]
name = "inline array"
formula = "=IMSUM({\"1+i\";\"2\"})"
expect = "3+i"

