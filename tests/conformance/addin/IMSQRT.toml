[[case]]
formula = "=IMSQRT(\"-4\")"
expect = "2i"

[[case]]
formula = "=IMSQRT(\"4\")"
expect = "2"

[[case]]
formula = "=IMSQRT(\"1+j\")"
expect = "1.09868411346781+0.455089860562227j"

[[case]]
formula = "=IMSQRT(\"abc\")"
expect = "Err:502"

[[case]]
formula = "=IMSQRT()"
