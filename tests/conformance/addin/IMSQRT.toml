# IMSQRT conformance vectors. Ported from Apache OpenOffice analysishelper.cxx. Schema: docs/contributing-functions.md.

[[case]]
formula = "=IMREAL(IMSQRT(\"1+i\"))"
expect = 1.09868411346781
tol = 1.0986841134678099e-11

[[case]]
formula = "=IMAGINARY(IMSQRT(\"1+i\"))"
expect = 0.45508986056222733
tol = 1e-11

[[case]]
formula = "=IMREAL(IMSQRT(\"3+4i\"))"
expect = 2.0
tol = 2e-11

[[case]]
formula = "=IMAGINARY(IMSQRT(\"3+4i\"))"
expect = 1.0
tol = 1e-11

[[case]]
formula = "=IMREAL(IMSQRT(\"2-3j\"))"
expect = 1.6741492280355401
tol = 1.67414922803554e-11

[[case]]
formula = "=IMAGINARY(IMSQRT(\"2-3j\"))"
expect = -0.8959774761298381
tol = 1e-11

[[case]]
formula = "=IMREAL(IMSQRT(\"-0.5+0.25i\"))"
expect = 0.17178037486125622
