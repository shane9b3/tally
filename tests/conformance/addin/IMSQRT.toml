[[case]]
formula = "=IMREAL(IMSQRT(\"-i\"))"
expect = 0.7071067811865476
tol = 1e-11

[[case]]
formula = "=IMAGINARY(IMSQRT(\"-i\"))"
expect = -0.7071067811865475
