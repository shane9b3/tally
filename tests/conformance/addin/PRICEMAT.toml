formula = "=PRICEMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;11);0.061;0.05;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=PRICEMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;11);0.061;0.05;\"\")"
expect = 100.251941015089
