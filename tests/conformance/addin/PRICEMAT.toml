# PRICEMAT conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=PRICEMAT(DATE(2008;2;15);DATE(2008;4;13);DATE(2007;11;11);0.061;0.061;0)"
expect = 99.98449888
tol = 1e-06

[[case]]
name = "basis omitted"
formula = "=PRICEMAT(DATE(2008;2;15);DATE(2008;4;13);DATE(2007;11;11);0.061;0.061)"
expect = 99.98449888
tol = 1e-06

[[case]]
name = "negative rate"
formula = "=PRICEMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;11);-0.01;0.06)"
expect = "Err:502"

[[case]]
name = "negative yield"
formula = "=PRICEMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;11);0.06;-0.01)"
expect = "Err:502"

