[[case]]
name = "non-numeric text basis"
formula = "=PRICEMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;11);0.061;0.05;\"x\")"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=PRICEMAT(DATE(2008;5;15);DATE(2008;2;15);DATE(2007;11;11);0.061;0.05;0)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=PRICEMAT(\"x\";DATE(2008;5;15);DATE(2007;11;11);0.061;0.05;0)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=PRICEMAT(A4;DATE(2008;5;15);DATE(2007;11;11);0.061;0.05;0)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=PRICEMAT(DATE(2008;2;15);DATE(2008;5;15);DATE(2007;11;11);0.061)"
expect = "Err:511"
