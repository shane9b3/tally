# SERIESSUM conformance vectors. Analysis add-in. Schema: docs/contributing-functions.md.

[[case]]
formula = "=SERIESSUM(2;1;1;{1;1;1})"
expect = 14

[[case]]
formula = "=SERIESSUM(2;0;1;{1;1;1})"
expect = 7

[[case]]
formula = "=SERIESSUM(2;0;2;{1;1;1})"
expect = 21

[[case]]
name = "0^0 is 1"
formula = "=SERIESSUM(0;0;1;{5;1})"
expect = 5

[[case]]
formula = "=SERIESSUM(1;1;1;{3})"
expect = 3

[[case]]
name = "column array"
formula = "=SERIESSUM(2;1;1;{1|2|3})"
expect = 34

[[case]]
cells = { A1 = 1, A2 = 1, A3 = 1 }
formula = "=SERIESSUM(2;1;1;A1:A3)"
expect = 14

[[case]]
cells = { A1 = 1, A2 = 2, A3 = 3 }
formula = "=SERIESSUM(PI();1;2;A1:A3)"
expect = 983.2132003700335
tol = 1e-09

[[case]]
name = "negative exponent"
formula = "=SERIESSUM(2;-1;1;{1;1})"
expect = 1.5

[[case]]
formula = "=SERIESSUM(\"x\";1;1;{1})"
expect = "#VALUE!"

[[case]]
formula = "=SERIESSUM(1;1;1)"
expect = "Err:511"
