# BIN2HEX conformance vectors. Analysis add-in; 10-digit two's complement. Schema: docs/contributing-functions.md.

[[case]]
formula = "=BIN2HEX(\"1111111111\")"
expect = "FFFFFFFFFF"

[[case]]
formula = "=BIN2HEX(\"11111111\")"
expect = "FF"

[[case]]
formula = "=BIN2HEX(\"11111111\";4)"
expect = "00FF"

[[case]]
formula = "=BIN2HEX(\"1\")"
expect = "1"

[[case]]
formula = "=BIN2HEX(\"1000000000\")"
expect = "FFFFFFFE00"

[[case]]
name = "places too small"
formula = "=BIN2HEX(\"11111111\";1)"
expect = "Err:502"

[[case]]
formula = "=BIN2HEX(\"11111111\";11)"
expect = "Err:502"

[[case]]
formula = "=BIN2HEX(\"2\")"
expect = "Err:502"

[[case]]
formula = "=BIN2HEX(\"0\")"
expect = "0"

[[case]]
formula = "=BIN2HEX()"
expect = "Err:511"
