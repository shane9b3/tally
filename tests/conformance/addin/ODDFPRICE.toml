# ODDFPRICE conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx). AOO 4.1 does not implement ODDFPRICE/ODDFYIELD (#VALUE!); Tally uses the Excel formula.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=ODDFPRICE(DATE(2008;11;11);DATE(2021;3;1);DATE(2008;10;15);DATE(2009;3;1);0.0785;0.0625;100;2;1)"
expect = 113.5977
tol = 0.0001
aoo_expect = "#VALUE!"
note = "AOO 4.1 does not implement ODDFPRICE/ODDFYIELD (#VALUE!); Tally uses the Excel formula."

[[case]]
name = "long first period"
formula = "=ODDFPRICE(DATE(2008;11;11);DATE(2021;3;1);DATE(2008;1;15);DATE(2009;3;1);0.0785;0.0625;100;2;1)"
expect = 113.488940839611
tol = 1e-09
aoo_expect = "#VALUE!"

[[case]]
name = "basis omitted"
formula = "=ODDFPRICE(DATE(2008;11;11);DATE(2021;3;1);DATE(2008;10;15);DATE(2009;3;1);0.0785;0.0625;100;2)"
expect = 113.599205828238
tol = 1e-09
aoo_expect = "#VALUE!"

[[case]]
name = "first coupon must follow settlement"
formula = "=ODDFPRICE(DATE(2008;11;11);DATE(2021;3;1);DATE(2008;10;15);DATE(2008;11;11);0.0785;0.0625;100;2)"
expect = "Err:502"

[[case]]
