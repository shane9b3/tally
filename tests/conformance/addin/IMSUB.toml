# IMSUB conformance vectors. Ported from Apache OpenOffice analysishelper.cxx. Schema: docs/contributing-functions.md.

[[case]]
formula = "=IMSUB(\"13+4i\";\"5+3i\")"
expect = "8+i"

[[case]]
formula = "=IMSUB(\"1\";\"1\")"
expect = "0"

[[case]]
formula = "=IMSUB(\"3j\";\"1j\")"
expect = "2j"

[[case]]
formula = "=IMSUB(\"5\";\"2\")"
expect = "3"

[[case]]
formula = "=IMSUB(\"i\";\"1\")"
expect = "-1+i"

[[case]]
formula = "=IMSUB(\"1+2i\";\"3+4j\")"
expect = "Err:502"

[[case]]
formula = "=IMSUB(\"0\";\"-1-i\")"
expect = "1+i"

[[case]]
formula = "=IMSUB(\"x\";\"1\")"
expect = "Err:502"

[[case]]
formula = "=IMSUB(\"1\")"
expect = "Err:511"

[[case]]
cells = { A1 = "=1/0" }
formula = "=IMSUB(A1;\"1\")"
expect = "#DIV/0!"

[[case]]
name = "numbers"
formula = "=IMSUB(5;2)"
expect = "3"

