[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=ODDFYIELD(A4;DATE(2021;3;1);DATE(2008;10;15);DATE(2009;3;1);0.0575;84.5;100;2;0)"
expect = "#DIV/0!"

[[case]]
