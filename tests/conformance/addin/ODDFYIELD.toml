# ODDFYIELD conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx). AOO 4.1 does not implement ODDFPRICE/ODDFYIELD (#VALUE!); Tally uses the Excel formula.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=ODDFYIELD(DATE(2008;11;11);DATE(2021;3;1);DATE(2008;10;15);DATE(2009;3;1);0.0575;84.5;100;2;0)"
expect = 0.0772
tol = 0.0001
aoo_expect = "#VALUE!"
note = "AOO 4.1 does not implement ODDFPRICE/ODDFYIELD (#VALUE!); Tally uses the Excel formula."

[[case]]
name = "inverse of ODDFPRICE"
formula = "=ODDFYIELD(DATE(2008;11;11);DATE(2021;3;1);DATE(2008;10;15);DATE(2009;3;1);0.0785;ODDFPRICE(DATE(2008;11;11);DATE(2021;3;1);DATE(2008;10;15);DATE(2009;3;1);0.0785;0.0625;100;2;1);100;2;1)"
expect = 0.0625
tol = 1e-09
aoo_expect = "#VALUE!"

[[case]]
name = "long first period"
formula = "=ODDFYIELD(DATE(2008;11;11);DATE(2021;3;1);DATE(2008;1;15);DATE(2009;3;1);0.0785;110;100;2;1)"
expect = 0.0663473339049145
tol = 1e-09
aoo_expect = "#VALUE!"

[[case]]
name = "price must be positive"
formula = "=ODDFYIELD(DATE(2008;11;11);DATE(2021;3;1);DATE(2008;10;15);DATE(2009;3;1);0.0785;0;100;2)"
expect = "Err:502"

