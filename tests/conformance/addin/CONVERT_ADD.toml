# CONVERT_ADD conformance vectors. Analysis add-in CONVERT (the plain name is the built-in). Schema: docs/contributing-functions.md.

[[case]]
formula = "=CONVERT_ADD(1;\"mi\";\"km\")"
expect = 1.609344
tol = 1e-09

[[case]]
formula = "=CONVERT_ADD(100;\"C\";\"F\")"
expect = 212
tol = 1e-09

