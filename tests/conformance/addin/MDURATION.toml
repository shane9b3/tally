# MDURATION conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;2;1)"
expect = 5.73567
tol = 1e-05

[[case]]
name = "basis omitted"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;2)"
expect = 5.73566981391884
tol = 1e-09

[[case]]
name = "zero coupon"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0;0.09;1;1)"
expect = 7.3394495412844
tol = 1e-09

[[case]]
name = "negative coupon"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);-0.01;0.09;2)"
expect = "Err:502"

[[case]]
name = "negative yield"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;-0.09;2)"
expect = "Err:502"

[[case]]
name = "basis 0"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;2;0)"
expect = 5.73566981391884
tol = 1e-09

[[case]]
name = "basis 1"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;2;1)"
expect = 5.73566981391884
tol = 1e-09

[[case]]
name = "basis 2"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;2;2)"
expect = 5.84731255714053
tol = 1e-09

[[case]]
name = "basis 3"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;2;3)"
expect = 5.74091330870811
tol = 1e-09

[[case]]
name = "basis 4"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;2;4)"
expect = 5.73566981391884
tol = 1e-09

[[case]]
name = "basis 5 is illegal"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;2;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;2;\"\")"
expect = 5.73566981391884
tol = 1e-09

[[case]]
name = "non-numeric text basis"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;2;\"x\")"
expect = "Err:502"

[[case]]
name = "frequency must be 1, 2 or 4"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09;3;1)"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=MDURATION(DATE(2016;1;1);DATE(2008;1;1);0.08;0.09;2;1)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=MDURATION(\"x\";DATE(2016;1;1);0.08;0.09;2;1)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=MDURATION(A4;DATE(2016;1;1);0.08;0.09;2;1)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=MDURATION(DATE(2008;1;1);DATE(2016;1;1);0.08;0.09)"
expect = "Err:511"
