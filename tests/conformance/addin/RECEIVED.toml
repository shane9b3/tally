[[case]]
name = "basis 5 is illegal"
formula = "=RECEIVED(DATE(2008;2;15);DATE(2008;5;15);1000000;0.0575;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=RECEIVED(DATE(2008;2;15);DATE(2008;5;15);1000000;0.0575;\"\")"
expect = 1014420.26586264
tol = 1.01442026586264e-06

[[case]]
name = "non-numeric text basis"
formula = "=RECEIVED(DATE(2008;2;15);DATE(2008;5;15);1000000;0.0575;\"x\")"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=RECEIVED(\"x\";DATE(2008;5;15);1000000;0.0575;2)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=RECEIVED(A4;DATE(2008;5;15);1000000;0.0575;2)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=RECEIVED(DATE(2008;2;15);DATE(2008;5;15);1000000)"
expect = "Err:511"
