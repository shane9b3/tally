# MULTINOMIAL conformance vectors. Analysis add-in. Schema: docs/contributing-functions.md.

[[case]]
formula = "=MULTINOMIAL(2;3;4)"
expect = 1260

[[case]]
formula = "=MULTINOMIAL(1)"
expect = 1

[[case]]
formula = "=MULTINOMIAL(1;1;1)"
expect = 6

[[case]]
formula = "=MULTINOMIAL(5;0)"
expect = 1

[[case]]
formula = "=MULTINOMIAL(0)"
expect = 1

[[case]]
name = "truncated"
formula = "=MULTINOMIAL(2.9;3.1)"
expect = 10

[[case]]
name = "range"
cells = { A1 = 2, A2 = 3, A3 = 4 }
formula = "=MULTINOMIAL(A1:A3)"
expect = 1260

[[case]]
cells = { A1 = 2, A2 = 3, A3 = 4, A4 = "x" }
formula = "=MULTINOMIAL(A1:A3)"
expect = 1260

[[case]]
formula = "=MULTINOMIAL(-1;3)"
expect = "Err:502"

[[case]]
formula = "=MULTINOMIAL(\"x\")"
expect = "#VALUE!"

[[case]]
formula = "=MULTINOMIAL()"
expect = "Err:511"
