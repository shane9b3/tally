# IMPOWER conformance vectors. Ported from Apache OpenOffice analysishelper.cxx. Schema: docs/contributing-functions.md.

[[case]]
formula = "=IMREAL(IMPOWER(\"2+3i\";3))"
expect = -45.99999999999999
tol = 4.6e-09

[[case]]
formula = "=IMAGINARY(IMPOWER(\"2+3i\";3))"
expect = 9.000000000000007
tol = 9.000000000000007e-10

