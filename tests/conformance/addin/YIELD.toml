# YIELD conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx). Secant/bisection search (getYield_).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100;2;0)"
expect = 0.065
tol = 1e-06

[[case]]
name = "inverse of PRICE"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;PRICE(DATE(2008;2;15);DATE(2016;11;15);0.0575;0.08;100;2;1);100;2;1)"
expect = 0.08
tol = 1e-09

[[case]]
name = "at par"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;100;100;1)"
expect = 0.0574554604331546
tol = 1e-09

[[case]]
name = "price must be positive"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;0;100;2)"
expect = "Err:502"

[[case]]
name = "negative coupon"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);-0.01;95;100;2)"
expect = "Err:502"

[[case]]
name = "basis 0"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100;2;0)"
expect = 0.0650000068807548
tol = 1e-09

[[case]]
name = "basis 1"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100;2;1)"
expect = 0.0650018206055469
tol = 1e-09

[[case]]
name = "basis 2"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100;2;2)"
expect = 0.0649500552855418
tol = 1e-09

[[case]]
name = "basis 3"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100;2;3)"
expect = 0.0650145923637548
tol = 1e-09

[[case]]
name = "basis 4"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100;2;4)"
expect = 0.0650000068807548
