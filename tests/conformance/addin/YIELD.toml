[[case]]
name = "basis 5 is illegal"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100;2;5)"
expect = "Err:502"

[[case]]
name = "empty text basis takes the default"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100;2;\"\")"
expect = 0.0650000068807548
tol = 1e-09

[[case]]
name = "non-numeric text basis"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100;2;\"x\")"
expect = "Err:502"

[[case]]
name = "frequency must be 1, 2 or 4"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100;3;0)"
expect = "Err:502"

[[case]]
name = "settlement after maturity"
formula = "=YIELD(DATE(2016;11;15);DATE(2008;2;15);0.0575;95.04287;100;2;0)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=YIELD(\"x\";DATE(2016;11;15);0.0575;95.04287;100;2;0)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=YIELD(A4;DATE(2016;11;15);0.0575;95.04287;100;2;0)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=YIELD(DATE(2008;2;15);DATE(2016;11;15);0.0575;95.04287;100)"
expect = "Err:511"
