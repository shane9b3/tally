# XIRR conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx). Newton (50 steps, eps 1e-10), then scans guesses -0.99..+0.99.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
cells = { A1 = -10000, A2 = 2750, A3 = 4250, A4 = 3250, A5 = 2750, B1 = 39448, B2 = 39508, B3 = 39751, B4 = 39859, B5 = 39904 }
formula = "=XIRR(A1:A5;B1:B5)"
expect = 0.373362535
tol = 1e-08

[[case]]
name = "inline arrays"
formula = "=XIRR({-10000;2750;4250;3250;2750};{39448;39508;39751;39859;39904})"
expect = 0.373362535
tol = 1e-08

[[case]]
name = "guess"
cells = { A1 = -10000, A2 = 2750, A3 = 4250, A4 = 3250, A5 = 2750, B1 = 39448, B2 = 39508, B3 = 39751, B4 = 39859, B5 = 39904 }
formula = "=XIRR(A1:A5;B1:B5;0.5)"
expect = 0.373362535
tol = 1e-08

[[case]]
name = "one year"
formula = "=XIRR({-100;110};{39448;39813})"
expect = 0.1
tol = 1e-09

[[case]]
name = "guess <= -1"
cells = { A1 = -10000, A2 = 2750, A3 = 4250, A4 = 3250, A5 = 2750, B1 = 39448, B2 = 39508, B3 = 39751, B4 = 39859, B5 = 39904 }
formula = "=XIRR(A1:A5;B1:B5;-1)"
expect = "Err:502"

[[case]]
name = "different lengths"
cells = { A1 = -10000, A2 = 2750, A3 = 4250, A4 = 3250, A5 = 2750, B1 = 39448, B2 = 39508, B3 = 39751, B4 = 39859, B5 = 39904 }
formula = "=XIRR(A1:A5;B1:B4)"
expect = "Err:502"

[[case]]
name = "no sign change"
formula = "=XIRR({100;110};{39448;39813})"
expect = "Err:502"

[[case]]
name = "error in range"
cells = { A1 = -100, A2 = "=1/0", B1 = 39448, B2 = 39813 }
formula = "=XIRR(A1:A2;B1:B2)"
expect = "Err:504"

[[case]]
name = "too few arguments"
cells = { A1 = -10000, A2 = 2750, A3 = 4250, A4 = 3250, A5 = 2750, B1 = 39448, B2 = 39508, B3 = 39751, B4 = 39859, B5 = 39904 }
formula = "=XIRR(A1:A5)"
expect = "Err:511"
