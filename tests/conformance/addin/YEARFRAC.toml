# YEARFRAC conformance vectors. Analysis add-in. Schema: docs/contributing-functions.md.

[[case]]
formula = "=YEARFRAC(DATE(2026;1;1);DATE(2026;7;1);0)"
expect = 0.5
tol = 1e-12

[[case]]
name = "default basis 0"
formula = "=YEARFRAC(DATE(2026;1;1);DATE(2026;7;1))"
expect = 0.5
tol = 1e-12

[[case]]
formula = "=YEARFRAC(DATE(2026;1;1);DATE(2026;7;1);1)"
expect = 0.4958904109589041
tol = 1e-12

[[case]]
formula = "=YEARFRAC(DATE(2026;1;1);DATE(2026;7;1);2)"
expect = 0.5027777777777778
tol = 1e-12

[[case]]
formula = "=YEARFRAC(DATE(2026;1;1);DATE(2026;7;1);3)"
expect = 0.4958904109589041
tol = 1e-12

[[case]]
formula = "=YEARFRAC(DATE(2026;1;31);DATE(2026;3;31);4)"
expect = 0.16666666666666666
tol = 1e-12

[[case]]
name = "order does not matter"
formula = "=YEARFRAC(DATE(2026;7;1);DATE(2026;1;1);0)"
expect = 0.5
tol = 1e-12

[[case]]
formula = "=YEARFRAC(DATE(2026;3;1);DATE(2026;3;1);1)"
expect = 0
tol = 1e-12

[[case]]
name = "multi-year average year length"
formula = "=YEARFRAC(DATE(2020;1;1);DATE(2022;1;1);1)"
expect = 2.0009124087591244
tol = 1e-12

[[case]]
formula = "=YEARFRAC(DATE(2024;1;1);DATE(2024;12;31);1)"
expect = 0.9972677595628415
tol = 1e-12

[[case]]
formula = "=YEARFRAC(DATE(2026;1;1);DATE(2026;7;1);5)"
expect = "Err:502"

[[case]]
formula = "=YEARFRAC(DATE(2026;1;1);DATE(2026;7;1);-1)"
expect = "Err:502"

[[case]]
formula = "=YEARFRAC(\"x\";1)"
expect = "#VALUE!"
