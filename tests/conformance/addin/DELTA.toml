# DELTA conformance vectors. Analysis add-in. Schema: docs/contributing-functions.md.

[[case]]
formula = "=DELTA(5;5)"
expect = 1

[[case]]
formula = "=DELTA(5;4)"
expect = 0

[[case]]
name = "default 0"
formula = "=DELTA(0)"
expect = 1

[[case]]
formula = "=DELTA(1)"
expect = 0

[[case]]
formula = "=DELTA(-2;-2)"
expect = 1

[[case]]
formula = "=DELTA(0.5;0.5)"
expect = 1

[[case]]
formula = "=DELTA(\"x\";1)"
expect = "#VALUE!"

[[case]]
formula = "=DELTA()"
expect = "Err:511"

[[case]]
formula = "=DELTA(1;2;3)"
expect = "Err:504"

[[case]]
name = "cell refs"
cells = { A1 = 3, A2 = 3 }
formula = "=DELTA(A1;A2)"
expect = 1

[[case]]
name = "empty cell is 0"
formula = "=DELTA(A1)"
expect = 1
