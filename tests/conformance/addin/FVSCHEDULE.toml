# FVSCHEDULE conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx). Range cells are read row by row; text and empty cells count as 0.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=FVSCHEDULE(1;{0.09;0.11;0.1})"
expect = 1.33089
tol = 1e-12

[[case]]
name = "range"
cells = { A1 = 0.09, A2 = 0.11, A3 = 0.1 }
formula = "=FVSCHEDULE(1;A1:A3)"
expect = 1.33089
tol = 1e-12

[[case]]
name = "text and empty cells are 0% periods"
cells = { A1 = 0.1, A2 = "x" }
formula = "=FVSCHEDULE(100;A1:A3)"
expect = 110
tol = 1e-12

[[case]]
name = "scalar schedule"
formula = "=FVSCHEDULE(100;0.5)"
expect = 150
tol = 1e-12

[[case]]
name = "error in range"
cells = { A1 = 0.1, A2 = "=1/0" }
formula = "=FVSCHEDULE(100;A1:A2)"
expect = "Err:504"
note = "AOO ScExternal: an error cell in an array argument is errIllegalParameter."

[[case]]
name = "boolean cell"
cells = { A1 = true }
formula = "=FVSCHEDULE(100;A1)"
expect = 200

[[case]]
name = "non-numeric principal"
formula = "=FVSCHEDULE(\"x\";{0.1})"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=FVSCHEDULE(A4;{0.1})"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=FVSCHEDULE(1)"
expect = "Err:511"
