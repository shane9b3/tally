# EFFECT_ADD conformance vectors. Ported AOO 4.1 Analysis add-in semantics (analysishelper.cxx, financial.cxx). Registered under the programmatic ODF name; plain EFFECT means the built-in EFFECTIVE.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=EFFECT_ADD(0.0525;4)"
expect = 0.0535427
tol = 1e-07

[[case]]
formula = "=EFFECT_ADD(0.1;12)"
expect = 0.104713067441297
tol = 1e-12

[[case]]
name = "periods truncated"
formula = "=EFFECT_ADD(0.1;4.9)"
expect = 0.103812890625
tol = 1e-09

[[case]]
name = "agrees with the built-in"
formula = "=EFFECT_ADD(0.1;4)-EFFECTIVE(0.1;4)"
expect = 0
tol = 1e-15

[[case]]
name = "rate must be positive"
formula = "=EFFECT_ADD(0;4)"
expect = "Err:502"

[[case]]
name = "periods below 1"
formula = "=EFFECT_ADD(0.1;0)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=EFFECT_ADD(\"x\";4)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=EFFECT_ADD(A4;4)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=EFFECT_ADD(0.1)"
expect = "Err:511"
