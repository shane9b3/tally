# NETWORKDAYS conformance vectors. Analysis add-in; Saturday and Sunday are free. Schema: docs/contributing-functions.md.

[[case]]
formula = "=NETWORKDAYS(DATE(2026;10;1);DATE(2026;10;31))"
expect = 22

[[case]]
name = "reversed gives negative"
formula = "=NETWORKDAYS(DATE(2026;10;31);DATE(2026;10;1))"
expect = -22

[[case]]
formula = "=NETWORKDAYS(DATE(2026;10;1);DATE(2026;10;31);DATE(2026;10;12))"
expect = 21

[[case]]
name = "holiday on a Saturday ignored"
formula = "=NETWORKDAYS(DATE(2026;10;1);DATE(2026;10;31);DATE(2026;10;10))"
expect = 22

[[case]]
formula = "=NETWORKDAYS(DATE(2026;10;19);DATE(2026;10;19))"
expect = 1

[[case]]
formula = "=NETWORKDAYS(DATE(2026;10;17);DATE(2026;10;18))"
expect = 0

[[case]]
formula = "=NETWORKDAYS(DATE(2026;10;19);DATE(2026;10;23))"
expect = 5

[[case]]
name = "holiday range"
cells = { A1 = 46307, A2 = 46308 }
formula = "=NETWORKDAYS(DATE(2026;10;1);DATE(2026;10;31);A1:A2)"
expect = 20

[[case]]
name = "duplicate holidays and text counted once"
cells = { A1 = 46307, A2 = 46307, A3 = "x" }
formula = "=NETWORKDAYS(DATE(2026;10;1);DATE(2026;10;31);A1:A2)"
expect = 21

[[case]]
formula = "=NETWORKDAYS(\"x\";1)"
expect = "#VALUE!"

[[case]]
formula = "=NETWORKDAYS(1)"
expect = "Err:511"
