# WEEKDAY conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "monday default type"
formula = '=WEEKDAY(46314)'
expect = 2

[[case]]
name = "sunday default type"
formula = '=WEEKDAY(46313)'
expect = 1

[[case]]
name = "saturday type 1"
formula = '=WEEKDAY(46319;1)'
expect = 7

[[case]]
name = "monday type 2"
formula = '=WEEKDAY(46314;2)'
expect = 1

[[case]]
name = "sunday type 2"
formula = '=WEEKDAY(46313;2)'
expect = 7

[[case]]
name = "monday type 3"
formula = '=WEEKDAY(46314;3)'
expect = 0

[[case]]
name = "sunday type 3"
formula = '=WEEKDAY(46313;3)'
expect = 6

[[case]]
name = "time ignored"
formula = '=WEEKDAY(46314.9)'
expect = 2

[[case]]
name = "unsupported type"
formula = '=WEEKDAY(46314;11)'
expect = "Err:502"
note = "AOO 4.1 supports only types 1-3."

[[case]]
name = "type zero"
formula = '=WEEKDAY(46314;0)'
expect = "Err:502"

[[case]]
name = "iso text"
formula = '=WEEKDAY("2026-10-19")'
expect = 2

[[case]]
name = "out of range"
formula = '=WEEKDAY(1E12)'
expect = "Err:502"

[[case]]
name = "error propagates"
cells = { A1 = "=NA()" }
formula = '=WEEKDAY(A1)'
expect = "#N/A"
