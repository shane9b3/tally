[[case]]
formula = "=DAYS360(DATE(2011;1;1);DATE(2011;12;31))"
expect = 360
note = "US method: end 31st after start not 30 becomes next month 1st."

[[case]]
formula = "=DAYS360(DATE(2011;1;31);DATE(2011;3;31))"
expect = 60

[[case]]
formula = "=DAYS360(DATE(2011;1;15);DATE(2011;3;31))"
expect = 76

[[case]]
formula = "=DAYS360(DATE(2011;1;15);DATE(2011;3;31);TRUE)"
expect = 75
note = "European method."

[[case]]
formula = "=DAYS360(DATE(2011;2;28);DATE(2011;3;31))"
expect = 30
note = "US: last day of February counts as 30."

[[case]]
formula = "=DAYS360(DATE(2011;2;28);DATE(2011;3;31);1)"
expect = 32

[[case]]
formula = "=DAYS360(DATE(2012;2;29);DATE(2012;3;31);FALSE)"
expect = 30

[[case]]
formula = "=DAYS360(DATE(2011;3;31);DATE(2011;1;31))"
expect = -60
note = "Reversed dates flip the sign."

[[case]]
formula = "=DAYS360(DATE(2011;5;1);DATE(2011;5;1))"
expect = 0

[[case]]
formula = "=DAYS360(\"x\";1)"
expect = "#VALUE!"

[[case]]
cells = { A1 = "=1/0" }
formula = "=DAYS360(1;A1)"
expect = "#DIV/0!"

[[case]]
formula = "=DAYS360(1)"
expect = "Err:511"
