# COS conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=COS(0.5)"
expect = 0.8775825618903728

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=COS(\"0.5\")"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=COS(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=COS(A1)"
expect = 1

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=COS(A1)"
expect = 0.5403023058681398

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=COS(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 0.5 }
origin = "C2"
formula = "=COS(A1:A2)"
expect = 0.8775825618903728

[[case]]
name = "no arguments"
formula = "=COS()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=COS(1;2)"
expect = "Err:504"

[[case]]
formula = "=COS(PI())"
expect = -1

[[case]]
formula = "=COS(PI()/2)"
expect = 0
tol = 1e-15

[[case]]
formula = "=COS(1000000)"
expect = 0.9367521275331447
tol = 1e-09

[[case]]
name = "numeric text (convert_locale)"
formula = "=COS(\"0.5\")"
expect = 0.8775825618903728
settings = { text_to_number = "convert_locale" }
