# GCD conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=GCD(12;18)"
expect = 6

[[case]]
formula = "=GCD(0;0)"
expect = 0

[[case]]
formula = "=GCD(5)"
expect = 5

[[case]]
formula = "=GCD(24;36;48)"
expect = 12

[[case]]
formula = "=GCD(-1;2)"
expect = "Err:502"

[[case]]
formula = "=GCD(7.9;21)"
expect = 7
note = "Truncated."

[[case]]
name = "text in range skipped"
cells = { A1 = 12, A2 = 18, A3 = "x" }
formula = "=GCD(A1:A3)"
expect = 6

[[case]]
formula = "=GCD(\"12\";18)"
expect = 6

[[case]]
formula = "=GCD(\"x\";2)"
expect = "#VALUE!"

[[case]]
formula = "=GCD(0;5)"
expect = 5

[[case]]
cells = { A1 = "=1/0", A2 = 4 }
formula = "=GCD(A1:A2)"
expect = "#DIV/0!"

[[case]]
name = "booleans in a range count as numbers"
cells = { A1 = true, A2 = 6 }
formula = "=GCD(A1:A2;4)"
expect = 1

[[case]]
formula = "=GCD()"
expect = "Err:511"

[[case]]
name = "empty range"
formula = "=GCD(A1:A2)"
expect = 0
