# CSC conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=CSC(0.5)"
expect = 2.085829642933488

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=CSC(\"0.5\")"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=CSC(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=CSC(A1)"
expect = "#DIV/0!"

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=CSC(A1)"
expect = 1.1883951057781212

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=CSC(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 0.5 }
origin = "C2"
formula = "=CSC(A1:A2)"
expect = 2.085829642933488

[[case]]
name = "no arguments"
formula = "=CSC()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=CSC(1;2)"
expect = "Err:504"

[[case]]
formula = "=CSC(0)"
expect = "#DIV/0!"

[[case]]
formula = "=CSC(PI()/2)"
expect = 1

[[case]]
formula = "=CSC(-1)"
expect = -1.1883951057781212

[[case]]
name = "numeric text (convert_locale)"
formula = "=CSC(\"0.5\")"
expect = 2.085829642933488
settings = { text_to_number = "convert_locale" }
