# ACOT conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=ACOT(1.0)"
expect = 0.7853981633974483

[[case]]
name = "numeric text"
formula = "=ACOT(\"1.0\")"
expect = 0.7853981633974483

[[case]]
name = "non-numeric text"
formula = "=ACOT(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=ACOT(A1)"
expect = 1.5707963267948966

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=ACOT(A1)"
expect = 0.7853981633974483

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=ACOT(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 1 }
origin = "C2"
formula = "=ACOT(A1:A2)"
expect = 0.7853981633974483

[[case]]
name = "no arguments"
formula = "=ACOT()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=ACOT(1;2)"
expect = "Err:504"

[[case]]
formula = "=ACOT(0)"
expect = 1.5707963267948966

[[case]]
formula = "=ACOT(-1)"
expect = 2.356194490192345

[[case]]
formula = "=ACOT(1E+10)"
expect = 1.000000082740371e-10
