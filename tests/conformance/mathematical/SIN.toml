# SIN conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=SIN(0.5)"
expect = 0.479425538604203

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=SIN(\"0.5\")"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=SIN(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=SIN(A1)"
expect = 0

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=SIN(A1)"
expect = 0.8414709848078965

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=SIN(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 0.5 }
origin = "C2"
formula = "=SIN(A1:A2)"
expect = 0.479425538604203

[[case]]
name = "no arguments"
formula = "=SIN()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=SIN(1;2)"
expect = "Err:504"

[[case]]
formula = "=SIN(PI()/2)"
expect = 1

[[case]]
formula = "=SIN(PI())"
expect = 0
tol = 1e-15

[[case]]
formula = "=SIN(-1)"
expect = -0.8414709848078965

[[case]]
name = "numeric text (convert_locale)"
formula = "=SIN(\"0.5\")"
expect = 0.479425538604203
settings = { text_to_number = "convert_locale" }
