# TAN conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=TAN(0.5)"
expect = 0.5463024898437905

[[case]]
name = "numeric text"
formula = "=TAN(\"0.5\")"
expect = 0.5463024898437905

[[case]]
name = "non-numeric text"
formula = "=TAN(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=TAN(A1)"
expect = 0

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=TAN(A1)"
expect = 1.557407724654902

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=TAN(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 0.5 }
origin = "C2"
formula = "=TAN(A1:A2)"
expect = 0.5463024898437905

[[case]]
name = "no arguments"
formula = "=TAN()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=TAN(1;2)"
expect = "Err:504"

[[case]]
formula = "=TAN(PI()/4)"
expect = 1
tol = 1e-15

[[case]]
formula = "=TAN(-1)"
expect = -1.557407724654902
