# ASINH conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=ASINH(0.5)"
expect = 0.48121182505960347

[[case]]
name = "numeric text"
formula = "=ASINH(\"0.5\")"
expect = 0.48121182505960347

[[case]]
name = "non-numeric text"
formula = "=ASINH(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=ASINH(A1)"
expect = 0

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=ASINH(A1)"
expect = 0.881373587019543

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=ASINH(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 0.5 }
origin = "C2"
formula = "=ASINH(A1:A2)"
expect = 0.48121182505960347

[[case]]
name = "no arguments"
formula = "=ASINH()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=ASINH(1;2)"
expect = "Err:504"

[[case]]
formula = "=ASINH(-3)"
expect = -1.8184464592320668

[[case]]
formula = "=ASINH(0)"
expect = 0
