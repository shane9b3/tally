# COMBIN conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=COMBIN(5;2)"
expect = 10

[[case]]
formula = "=COMBIN(5;0)"
expect = 1

[[case]]
formula = "=COMBIN(5;5)"
expect = 1

[[case]]
formula = "=COMBIN(5;6)"
expect = "Err:502"

[[case]]
formula = "=COMBIN(-1;0)"
expect = "Err:502"

[[case]]
formula = "=COMBIN(5;-1)"
expect = "Err:502"

[[case]]
formula = "=COMBIN(5.9;2.9)"
expect = 10
note = "Both arguments truncated."

[[case]]
formula = "=COMBIN(52;5)"
expect = 2598960

[[case]]
formula = "=COMBIN(0;0)"
expect = 1

[[case]]
formula = "=COMBIN(\"x\";1)"
expect = "#VALUE!"

[[case]]
formula = "=COMBIN(49;6)"
expect = 13983816

[[case]]
name = "cell references"
cells = { A1 = 4, A2 = 2 }
formula = "=COMBIN(A1;A2)"
expect = 6

[[case]]
cells = { A1 = "=1/0" }
formula = "=COMBIN(A1;1)"
expect = "#DIV/0!"

[[case]]
formula = "=COMBIN(5)"
expect = "Err:511"

[[case]]
formula = "=COMBIN(5;2;1)"
expect = "Err:504"

[[case]]
formula = "=COMBIN(2000000000;1000000000)"
expect = "#NUM!"
note = "Overflow."

[[case]]
formula = "=COMBIN(TRUE;TRUE)"
expect = 1
