# SEC conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=SEC(0.5)"
expect = 1.139493927324549

[[case]]
name = "numeric text"
formula = "=SEC(\"0.5\")"
expect = 1.139493927324549

[[case]]
name = "non-numeric text"
formula = "=SEC(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=SEC(A1)"
expect = 1

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=SEC(A1)"
expect = 1.8508157176809255

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=SEC(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 0.5 }
origin = "C2"
formula = "=SEC(A1:A2)"
expect = 1.139493927324549

[[case]]
name = "no arguments"
formula = "=SEC()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=SEC(1;2)"
expect = "Err:504"

[[case]]
formula = "=SEC(0)"
expect = 1

[[case]]
formula = "=SEC(PI())"
expect = -1

[[case]]
formula = "=SEC(1)"
expect = 1.8508157176809255
