# TANH conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=TANH(0.5)"
expect = 0.46211715726000974

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=TANH(\"0.5\")"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=TANH(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=TANH(A1)"
expect = 0

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=TANH(A1)"
expect = 0.7615941559557649

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=TANH(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 0.5 }
origin = "C2"
formula = "=TANH(A1:A2)"
expect = 0.46211715726000974

[[case]]
name = "no arguments"
formula = "=TANH()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=TANH(1;2)"
expect = "Err:504"

[[case]]
formula = "=TANH(1000)"
expect = 1

[[case]]
formula = "=TANH(-1000)"
expect = -1

[[case]]
formula = "=TANH(0)"
expect = 0

[[case]]
name = "numeric text (convert_locale)"
formula = "=TANH(\"0.5\")"
expect = 0.46211715726000974
settings = { text_to_number = "convert_locale" }
