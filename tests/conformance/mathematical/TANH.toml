# TANH conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=TANH(0.5)"
expect = 0.46211715726000974

[[case]]
name = "numeric text"
formula = "=TANH(\"0.5\")"
expect = 0.46211715726000974

[[case]]
name = "non-numeric text"
formula = "=TANH(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=TANH(A1)"
expect = 0

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=TANH(A1)"
expect = 0.7615941559557649

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=TANH(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 0.5 }
origin = "C2"
formula = "=TANH(A1:A2)"
expect = 0.46211715726000974

[[case]]
name = "no arguments"
formula = "=TANH()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=TANH(1;2)"
expect = "Err:504"

[[case]]
formula = "=TANH(1000)"
expect = 1

[[case]]
formula = "=TANH(-1000)"
expect = -1

[[case]]
formula = "=TANH(0)"
expect = 0
