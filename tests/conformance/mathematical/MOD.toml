# MOD conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=MOD(5;3)"
expect = 2

[[case]]
name = "sign of divisor"
formula = "=MOD(-5;3)"
expect = 1

[[case]]
formula = "=MOD(5;-3)"
expect = -1

[[case]]
formula = "=MOD(-5;-3)"
expect = -2

[[case]]
formula = "=MOD(5;0)"
expect = "#DIV/0!"

[[case]]
formula = "=MOD(5.5;2)"
expect = 1.5
tol = 1e-12

[[case]]
name = "residue snapped"
formula = "=MOD(1;0.1)"
expect = 0
tol = 1e-12

[[case]]
formula = "=MOD(0;7)"
expect = 0

[[case]]
formula = "=MOD(\"x\";2)"
expect = "#VALUE!"

[[case]]
name = "empty dividend"
formula = "=MOD(A1;3)"
expect = 0

[[case]]
name = "empty divisor is zero"
formula = "=MOD(7;A1)"
expect = "#DIV/0!"

[[case]]
name = "error propagates"
cells = { A1 = "=NA()" }
formula = "=MOD(A1;2)"
expect = "#N/A"

[[case]]
formula = "=MOD(5)"
expect = "Err:511"
