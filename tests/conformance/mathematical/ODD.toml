# ODD conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=ODD(1.5)"
expect = 3

[[case]]
name = "numeric text"
formula = "=ODD(\"1.5\")"
expect = 3

[[case]]
name = "non-numeric text"
formula = "=ODD(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=ODD(A1)"
expect = 1

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=ODD(A1)"
expect = 1

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=ODD(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 1.5 }
origin = "C2"
formula = "=ODD(A1:A2)"
expect = 3

[[case]]
name = "no arguments"
formula = "=ODD()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=ODD(1;2)"
expect = "Err:504"

[[case]]
formula = "=ODD(1)"
expect = 1

[[case]]
formula = "=ODD(2)"
expect = 3

[[case]]
formula = "=ODD(0)"
expect = 1
note = "ODD(0) is 1."

[[case]]
formula = "=ODD(-2)"
expect = -3

[[case]]
formula = "=ODD(-1.5)"
expect = -3

[[case]]
formula = "=ODD(-0.5)"
expect = -1
