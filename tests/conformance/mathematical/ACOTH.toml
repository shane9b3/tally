# ACOTH conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=ACOTH(2.0)"
expect = 0.5493061443340549

[[case]]
name = "numeric text"
formula = "=ACOTH(\"2.0\")"
expect = 0.5493061443340549

[[case]]
name = "non-numeric text"
formula = "=ACOTH(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=ACOTH(A1)"
expect = "Err:502"

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=ACOTH(A1)"
expect = "#NUM!"

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=ACOTH(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 2 }
origin = "C2"
formula = "=ACOTH(A1:A2)"
expect = 0.5493061443340549

[[case]]
name = "no arguments"
formula = "=ACOTH()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=ACOTH(1;2)"
expect = "Err:504"

[[case]]
formula = "=ACOTH(1)"
expect = "#NUM!"

[[case]]
formula = "=ACOTH(-1)"
expect = "#NUM!"

[[case]]
formula = "=ACOTH(0.5)"
expect = "Err:502"

[[case]]
formula = "=ACOTH(-3)"
expect = -0.34657359027997264

[[case]]
formula = "=ACOTH(0)"
expect = "Err:502"
