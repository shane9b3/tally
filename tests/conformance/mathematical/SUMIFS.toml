# SUMIFS conformance vectors. Common grid: A1=1, A2="x", A3=TRUE, A4=#DIV/0!, A5 empty, A6=5; B1:B6 = 10..60. Schema: docs/contributing-functions.md.

[[case]]
name = "two criteria"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(B1:B6;A1:A6;\">0\";B1:B6;\">=30\")"
expect = 90

[[case]]
name = "one criterion"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(B1:B6;A1:A6;\">0\")"
expect = 100

[[case]]
name = "blank criterion"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(B1:B6;A1:A6;\"\")"
expect = 50

[[case]]
name = "mismatched dimensions"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(B1:B6;A1:A5;\">0\")"
expect = "Err:502"
note = "AOO interpr1.cxx IterateParametersIfs: a range whose size differs from the first sets errIllegalArgument (Err:502); Excel gives #VALUE!."

[[case]]
name = "selected error cell propagates"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(A1:A6;B1:B6;\">0\")"
expect = "#DIV/0!"

[[case]]
name = "text and empty sum cells ignored, bool counted"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(A1:A6;B1:B6;\"<35\")"
expect = 2

[[case]]
name = "no match"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(B1:B6;A1:A6;\"zzz\")"
expect = 0

[[case]]
name = "criteria excluding each other"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(B1:B6;A1:A6;\"x\";B1:B6;\"<>20\")"
expect = 0

[[case]]
name = "whole columns"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(B1:B1048576;A1:A1048576;\"\")"
expect = 50

[[case]]
name = "missing criterion"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(B1:B6;A1:A6)"
expect = "Err:511"

[[case]]
name = "dangling range"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=SUMIFS(B1:B6;A1:A6;\">0\";B1:B6)"
expect = "Err:511"
