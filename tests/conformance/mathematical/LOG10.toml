# LOG10 conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=LOG10(100.0)"
expect = 2

[[case]]
name = "numeric text"
formula = "=LOG10(\"100.0\")"
expect = 2

[[case]]
name = "non-numeric text"
formula = "=LOG10(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=LOG10(A1)"
expect = "Err:502"

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=LOG10(A1)"
expect = 0

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=LOG10(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 100 }
origin = "C2"
formula = "=LOG10(A1:A2)"
expect = 2

[[case]]
name = "no arguments"
formula = "=LOG10()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=LOG10(1;2)"
expect = "Err:504"

[[case]]
formula = "=LOG10(0)"
expect = "Err:502"

[[case]]
formula = "=LOG10(-5)"
expect = "Err:502"

[[case]]
formula = "=LOG10(1000)"
expect = 3

[[case]]
formula = "=LOG10(0.001)"
expect = -3

[[case]]
formula = "=LOG10(1)"
expect = 0
