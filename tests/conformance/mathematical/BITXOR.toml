# BITXOR conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=BITXOR(12;10)"
expect = 6

[[case]]
formula = "=BITXOR(0;0)"
expect = 0

[[case]]
formula = "=BITXOR(281474976710655;1)"
expect = 281474976710654

[[case]]
formula = "=BITXOR(-1;1)"
expect = "Err:502"
note = "Negative operand."

[[case]]
formula = "=BITXOR(1;-1)"
expect = "Err:502"

[[case]]
formula = "=BITXOR(281474976710656;1)"
expect = "Err:502"
note = "2^48 is out of range."

[[case]]
formula = "=BITXOR(7.9;3)"
expect = 4
note = "Truncated."

[[case]]
formula = "=BITXOR(\"12\";\"10\")"
expect = 6

[[case]]
formula = "=BITXOR(\"x\";1)"
expect = "#VALUE!"

[[case]]
name = "empty cell"
formula = "=BITXOR(A1;5)"
expect = 5

[[case]]
cells = { A1 = "=1/0" }
formula = "=BITXOR(A1;5)"
expect = "#DIV/0!"

[[case]]
formula = "=BITXOR(1)"
expect = "Err:511"

[[case]]
formula = "=BITXOR(1;2;3)"
expect = "Err:504"

[[case]]
formula = "=BITXOR(TRUE;3)"
expect = 2
