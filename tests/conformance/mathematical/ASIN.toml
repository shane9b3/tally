# ASIN conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=ASIN(0.5)"
expect = 0.5235987755982988

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=ASIN(\"0.5\")"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=ASIN(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=ASIN(A1)"
expect = 0

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=ASIN(A1)"
expect = 1.5707963267948966

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=ASIN(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 0.5 }
origin = "C2"
formula = "=ASIN(A1:A2)"
expect = 0.5235987755982988

[[case]]
name = "no arguments"
formula = "=ASIN()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=ASIN(1;2)"
expect = "Err:504"

[[case]]
formula = "=ASIN(2)"
expect = "Err:502"

[[case]]
formula = "=ASIN(-1)"
expect = -1.5707963267948966

[[case]]
formula = "=ASIN(1)"
expect = 1.5707963267948966

[[case]]
name = "numeric text (convert_locale)"
formula = "=ASIN(\"0.5\")"
expect = 0.5235987755982988
settings = { text_to_number = "convert_locale" }
