# ACOSH conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=ACOSH(2.0)"
expect = 1.3169578969248166

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=ACOSH(\"2.0\")"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=ACOSH(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=ACOSH(A1)"
expect = "Err:502"

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=ACOSH(A1)"
expect = 0

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=ACOSH(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 2 }
origin = "C2"
formula = "=ACOSH(A1:A2)"
expect = 1.3169578969248166

[[case]]
name = "no arguments"
formula = "=ACOSH()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=ACOSH(1;2)"
expect = "Err:504"

[[case]]
formula = "=ACOSH(1)"
expect = 0

[[case]]
formula = "=ACOSH(0.5)"
expect = "Err:502"

[[case]]
formula = "=ACOSH(-2)"
expect = "Err:502"

[[case]]
formula = "=ACOSH(1000)"
expect = 7.600902209541989

[[case]]
name = "numeric text (convert_locale)"
formula = "=ACOSH(\"2.0\")"
expect = 1.3169578969248166
settings = { text_to_number = "convert_locale" }
