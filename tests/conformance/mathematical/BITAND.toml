# BITAND conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=BITAND(12;10)"
expect = 8

[[case]]
formula = "=BITAND(0;0)"
expect = 0

[[case]]
formula = "=BITAND(281474976710655;1)"
expect = 1

[[case]]
formula = "=BITAND(-1;1)"
expect = "Err:502"
note = "Negative operand."

[[case]]
formula = "=BITAND(1;-1)"
expect = "Err:502"

[[case]]
formula = "=BITAND(281474976710656;1)"
expect = "Err:502"
note = "2^48 is out of range."

[[case]]
formula = "=BITAND(7.9;3)"
expect = 3
note = "Truncated."

[[case]]
formula = "=BITAND(\"12\";\"10\")"
expect = 8

[[case]]
formula = "=BITAND(\"x\";1)"
expect = "#VALUE!"

[[case]]
name = "empty cell"
formula = "=BITAND(A1;5)"
expect = 0

[[case]]
cells = { A1 = "=1/0" }
formula = "=BITAND(A1;5)"
expect = "#DIV/0!"

[[case]]
formula = "=BITAND(1)"
expect = "Err:511"

[[case]]
formula = "=BITAND(1;2;3)"
expect = "Err:504"

[[case]]
formula = "=BITAND(TRUE;3)"
expect = 1
