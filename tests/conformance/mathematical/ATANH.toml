# ATANH conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=ATANH(0.5)"
expect = 0.5493061443340549

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=ATANH(\"0.5\")"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=ATANH(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=ATANH(A1)"
expect = 0

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=ATANH(A1)"
expect = "#NUM!"

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=ATANH(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 0.5 }
origin = "C2"
formula = "=ATANH(A1:A2)"
expect = 0.5493061443340549

[[case]]
name = "no arguments"
formula = "=ATANH()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=ATANH(1;2)"
expect = "Err:504"

[[case]]
formula = "=ATANH(1)"
expect = "#NUM!"

[[case]]
formula = "=ATANH(-1)"
expect = "#NUM!"

[[case]]
formula = "=ATANH(2)"
expect = "Err:502"

[[case]]
formula = "=ATANH(0)"
expect = 0

[[case]]
name = "numeric text (convert_locale)"
formula = "=ATANH(\"0.5\")"
expect = 0.5493061443340549
settings = { text_to_number = "convert_locale" }
