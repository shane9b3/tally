# ISODD conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=ISODD(3.0)"
expect = true

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=ISODD(\"3.0\")"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=ISODD(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=ISODD(A1)"
expect = false

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=ISODD(A1)"
expect = true

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=ISODD(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 3 }
origin = "C2"
formula = "=ISODD(A1:A2)"
expect = true

[[case]]
name = "no arguments"
formula = "=ISODD()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=ISODD(1;2)"
expect = "Err:504"

[[case]]
formula = "=ISODD(2.9)"
expect = false

[[case]]
formula = "=ISODD(-3)"
expect = true

[[case]]
formula = "=ISODD(-2.5)"
expect = false
note = "Truncated toward zero: -2 is even."

[[case]]
formula = "=ISODD(0)"
expect = false

[[case]]
formula = "=ISODD(\"4\")"
expect = false

[[case]]
name = "numeric text (convert_locale)"
formula = "=ISODD(\"3.0\")"
expect = true
settings = { text_to_number = "convert_locale" }
