# FLOOR conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=FLOOR(2.5;1)"
expect = 2

[[case]]
formula = "=FLOOR(2.5;2)"
expect = 2

[[case]]
formula = "=FLOOR(1.29;0.1)"
expect = 1.2

[[case]]
formula = "=FLOOR(0.3;0.1)"
expect = 0.3
note = "approxFloor snaps 2.9999999999999996 to 3."

[[case]]
formula = "=FLOOR(-2.5;-1)"
expect = -3
note = "Mode 0: negative numbers round away from zero (AOO ScFloor)."

[[case]]
formula = "=FLOOR(-2.5;-1;0)"
expect = -3

[[case]]
formula = "=FLOOR(-2.5;-1;1)"
expect = -2
note = "Non-zero mode: rounds by absolute value, toward zero."

[[case]]
formula = "=FLOOR(2.5;1;1)"
expect = 2

[[case]]
formula = "=FLOOR(-2.5;1)"
expect = "Err:502"

[[case]]
formula = "=FLOOR(2.5;-1)"
expect = "Err:502"

[[case]]
formula = "=FLOOR(7;0)"
expect = 0

[[case]]
formula = "=FLOOR(0;5)"
expect = 0

[[case]]
name = "empty number"
formula = "=FLOOR(A1;1)"
expect = 0

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=FLOOR(\"7.9\";2)"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
formula = "=FLOOR(1.5;\"x\")"
expect = "#VALUE!"

[[case]]
cells = { A1 = "=1/0" }
formula = "=FLOOR(A1;1)"
expect = "#DIV/0!"

[[case]]
formula = "=FLOOR(1)"
expect = "Err:511"

[[case]]
formula = "=FLOOR(1;2;3;4)"
expect = "Err:504"

[[case]]
formula = "=FLOOR(6;3)"
expect = 6

[[case]]
name = "decimal text with convert_locale"
formula = "=FLOOR(\"7.9\";2)"
expect = 6
settings = { text_to_number = "convert_locale" }
