# ATAN conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=ATAN(1.0)"
expect = 0.7853981633974483

[[case]]
name = "numeric text"
formula = "=ATAN(\"1.0\")"
expect = 0.7853981633974483

[[case]]
name = "non-numeric text"
formula = "=ATAN(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=ATAN(A1)"
expect = 0

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=ATAN(A1)"
expect = 0.7853981633974483

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=ATAN(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 1 }
origin = "C2"
formula = "=ATAN(A1:A2)"
expect = 0.7853981633974483

[[case]]
name = "no arguments"
formula = "=ATAN()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=ATAN(1;2)"
expect = "Err:504"

[[case]]
formula = "=ATAN(1E+10)"
expect = 1.5707963266948965

[[case]]
formula = "=ATAN(-1)"
expect = -0.7853981633974483

[[case]]
formula = "=ATAN(0)"
expect = 0
