# EXP conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=EXP(1.0)"
expect = 2.718281828459045

[[case]]
name = "numeric text"
formula = "=EXP(\"1.0\")"
expect = 2.718281828459045

[[case]]
name = "non-numeric text"
formula = "=EXP(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=EXP(A1)"
expect = 1

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=EXP(A1)"
expect = 2.718281828459045

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=EXP(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 1 }
origin = "C2"
formula = "=EXP(A1:A2)"
expect = 2.718281828459045

[[case]]
name = "no arguments"
formula = "=EXP()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=EXP(1;2)"
expect = "Err:504"

[[case]]
formula = "=EXP(1000)"
expect = "#NUM!"
note = "Overflow is #NUM!."

[[case]]
formula = "=EXP(-1000)"
expect = 0

[[case]]
formula = "=EXP(0)"
expect = 1

[[case]]
formula = "=EXP(709)"
expect = 8.218407461554972e+307

[[case]]
formula = "=EXP(-1)"
expect = 0.36787944117144233
