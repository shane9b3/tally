# AVERAGEIFS conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "one criterion"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=AVERAGEIFS(B1:B6;A1:A6;\">0\")"
expect = 33.333333333333336

[[case]]
name = "two criteria"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=AVERAGEIFS(B1:B6;A1:A6;\">0\";B1:B6;\">=30\")"
