# RADIANS conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=RADIANS(90.0)"
expect = 1.5707963267948966

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=RADIANS(\"90.0\")"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=RADIANS(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=RADIANS(A1)"
expect = 0

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=RADIANS(A1)"
expect = 0.017453292519943295

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=RADIANS(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 90 }
origin = "C2"
formula = "=RADIANS(A1:A2)"
expect = 1.5707963267948966

[[case]]
name = "no arguments"
formula = "=RADIANS()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=RADIANS(1;2)"
expect = "Err:504"

[[case]]
formula = "=RADIANS(180)"
expect = 3.141592653589793

[[case]]
formula = "=RADIANS(-360)"
expect = -6.283185307179586

[[case]]
formula = "=RADIANS(0)"
expect = 0

[[case]]
name = "numeric text (convert_locale)"
formula = "=RADIANS(\"90.0\")"
expect = 1.5707963267948966
settings = { text_to_number = "convert_locale" }
