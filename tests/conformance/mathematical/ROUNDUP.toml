# ROUNDUP conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=ROUNDUP(1.01;1)"
expect = 1.1
tol = 1e-12

[[case]]
name = "away from zero, count omitted"
formula = "=ROUNDUP(-1.01)"
expect = -2

[[case]]
name = "binary residue does not push up"
formula = "=ROUNDUP(3.1;1)"
expect = 3.1
tol = 1e-12

[[case]]
formula = "=ROUNDUP(1234;-2)"
expect = 1300

[[case]]
formula = "=ROUNDUP(0;3)"
expect = 0

[[case]]
name = "count out of range"
formula = "=ROUNDUP(5;21)"
expect = "Err:502"

[[case]]
formula = "=ROUNDUP(5;-21)"
expect = "Err:502"

[[case]]
name = "count is floored"
formula = "=ROUNDUP(1.2;1.9)"
expect = 1.2
tol = 1e-12

[[case]]
formula = "=ROUNDUP(\"x\";1)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=ROUNDUP(A1;0)"
expect = "#DIV/0!"

[[case]]
name = "empty cell"
formula = "=ROUNDUP(A1;0)"
expect = 0

[[case]]
name = "bool"
formula = "=ROUNDUP(TRUE;0)"
expect = 1

[[case]]
name = "empty count argument"
formula = "=ROUNDUP(2.5;)"
expect = 3

[[case]]
formula = "=ROUNDUP()"
expect = "Err:511"
