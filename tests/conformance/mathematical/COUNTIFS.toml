# COUNTIFS conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "two criteria"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;\">0\";B1:B6;\">=30\")"
expect = 2

[[case]]
name = "booleans match numeric criteria"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;\">0\")"
expect = 3

[[case]]
name = "blank criterion counts the empty cell"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;\"\")"
expect = 1

[[case]]
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;\"\";B1:B6;\">=50\")"
expect = 1

[[case]]
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;\"x\")"
expect = 1

[[case]]
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;\"<>\")"
expect = 5

[[case]]
name = "mismatched dimensions"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;\">0\";B1:B5;\">0\")"
expect = "#VALUE!"

[[case]]
name = "unpaired argument"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;\">0\";B1:B6)"
expect = "Err:511"

[[case]]
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6)"
expect = "Err:511"

[[case]]
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS()"
expect = "Err:511"

[[case]]
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;\"zzz\")"
expect = 0

[[case]]
name = "error cells match error text"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;\"#DIV/0!\")"
expect = 1

[[case]]
name = "TRUE matches 1"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;1;B1:B6;30)"
expect = 1

[[case]]
name = "two-column range"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:B6;\"\")"
expect = 1

[[case]]
name = "entirely empty range"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(C1:C6;\"\")"
expect = 6

[[case]]
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(C1:C6;\"\";A1:A6;\"\")"
expect = 1

[[case]]
name = "error criterion propagates"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = "=1/0", A6 = 5, B1 = 10, B2 = 20, B3 = 30, B4 = 40, B5 = 50, B6 = 60 }
formula = "=COUNTIFS(A1:A6;A4)"
expect = "#DIV/0!"
