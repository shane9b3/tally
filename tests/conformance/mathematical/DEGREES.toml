# DEGREES conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=DEGREES(1.0)"
expect = 57.29577951308232

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=DEGREES(\"1.0\")"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=DEGREES(\"x\")"
expect = "#VALUE!"

[[case]]
name = "empty cell is 0"
formula = "=DEGREES(A1)"
expect = 0

[[case]]
name = "TRUE is 1"
cells = { A1 = true }
formula = "=DEGREES(A1)"
expect = 57.29577951308232

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=DEGREES(A1)"
expect = "#DIV/0!"

[[case]]
name = "implicit intersection"
cells = { A1 = 99, A2 = 1 }
origin = "C2"
formula = "=DEGREES(A1:A2)"
expect = 57.29577951308232

[[case]]
name = "no arguments"
formula = "=DEGREES()"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=DEGREES(1;2)"
expect = "Err:504"

[[case]]
formula = "=DEGREES(PI())"
expect = 180

[[case]]
formula = "=DEGREES(-PI()/2)"
expect = -90

[[case]]
formula = "=DEGREES(0)"
expect = 0

[[case]]
name = "numeric text (convert_locale)"
formula = "=DEGREES(\"1.0\")"
expect = 57.29577951308232
settings = { text_to_number = "convert_locale" }
