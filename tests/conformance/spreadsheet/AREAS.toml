[[case]]
formula = "=AREAS(A1)"
expect = 1

[[case]]
formula = "=AREAS(A1:C5)"
expect = 1

[[case]]
formula = "=AREAS(A:A)"
expect = 1

[[case]]
formula = "=AREAS(5)"
expect = "#VALUE!"

[[case]]
formula = "=AREAS(\"A1\")"
expect = "#VALUE!"

[[case]]
cells = { A1 = "=1/0" }
formula = "=AREAS(A1)"
expect = 1
note = "Value of the cell is irrelevant."

[[case]]
formula = "=AREAS()"
expect = "Err:511"

[[case]]
formula = "=AREAS(A1;B1)"
expect = "Err:504"

[[case]]
formula = "=AREAS(OFFSET(A1;1;1;2;2))"
expect = 1

[[case]]
formula = "=AREAS(INDIRECT(\"B2:C3\"))"
expect = 1

[[case]]
name = "3D reference is one area"
cells = { A1 = 10, "Sheet2.A1" = 20, "Sheet2.A2" = "t", "Sheet3.A1" = 30, "Sheet4.A1" = 40 }
formula = "=AREAS(Sheet1.A1:Sheet3.A2)"
expect = 1
