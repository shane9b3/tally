# MULTIPLE.OPERATIONS reaches the engine through `EvalContext::table_op`.
# Until the engine's what-if sandbox (W5-3) answers, every well-formed call
# is `Err:504`; the cases here pin the argument validation, which follows
# AOO's ScTableOp (3 or 5 arguments, single-cell references for the formula
# and the input cells). Value cases live in the engine's
# `multiple_operations_one_and_two_variable` test.

[[case]]
name = "one-variable form, replacement from a cell"
cells = { A1 = "=B1*2", B1 = 1, B2 = 5 }
formula = "=MULTIPLE.OPERATIONS(A1;B1;B2)"
expect = "Err:504"
note = "Err:504 until the engine provides table_op; then 10."

[[case]]
name = "one-variable form, replacement as a constant"
cells = { A1 = "=B1*2", B1 = 1 }
formula = "=MULTIPLE.OPERATIONS(A1;B1;5)"
expect = "Err:504"

[[case]]
name = "two-variable form"
cells = { A1 = "=B1*C1", B1 = 1, C1 = 1 }
formula = "=MULTIPLE.OPERATIONS(A1;B1;5;C1;6)"
expect = "Err:504"

[[case]]
name = "two-variable form with replacements in cells"
cells = { A1 = "=B1+C1", B1 = 1, C1 = 2, B2 = 10, C2 = 20 }
formula = "=MULTIPLE.OPERATIONS(A1;B1;B2;C1;C2)"
expect = "Err:504"

[[case]]
name = "formula argument must be a reference"
formula = "=MULTIPLE.OPERATIONS(1;2;3)"
expect = "Err:504"
note = "AOO PopSingleRef on a number: errIllegalParameter."

[[case]]
name = "input cell must be a single cell"
cells = { A1 = "=B1*2", B1 = 1 }
formula = "=MULTIPLE.OPERATIONS(A1;B1:B2;5)"
expect = "Err:504"

[[case]]
name = "formula must be a single cell"
cells = { A1 = "=B1*2", B1 = 1 }
formula = "=MULTIPLE.OPERATIONS(A1:A2;B1;5)"
expect = "Err:504"

[[case]]
name = "four arguments"
cells = { A1 = "=B1*C1", B1 = 1, C1 = 1 }
formula = "=MULTIPLE.OPERATIONS(A1;B1;5;C1)"
expect = "Err:504"
note = "AOO ScTableOp accepts 3 or 5 arguments only."

[[case]]
name = "error in a replacement propagates"
cells = { A1 = "=B1*2", B1 = 1 }
formula = "=MULTIPLE.OPERATIONS(A1;B1;1/0)"
expect = "#DIV/0!"

[[case]]
name = "error in the formula reference propagates"
cells = { A1 = "=B1*2", B1 = 1, D1 = "=NA()" }
formula = "=MULTIPLE.OPERATIONS(IF(D1;A1;A1);B1;5)"
expect = "#N/A"

[[case]]
name = "IFERROR catches it"
cells = { A1 = "=B1*2", B1 = 1 }
formula = "=IFERROR(MULTIPLE.OPERATIONS(A1;B1;5);\"n/a\")"
expect = "n/a"

[[case]]
name = "too few arguments"
formula = "=MULTIPLE.OPERATIONS(A1;B1)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=MULTIPLE.OPERATIONS(A1;B1;5;C1;6;D1)"
expect = "Err:504"

[[case]]
formula = "=MULTIPLE.OPERATIONS()"
expect = "Err:511"
