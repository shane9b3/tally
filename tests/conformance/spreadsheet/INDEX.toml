# INDEX conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "cell"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=INDEX(A1:C3;2;3)"
expect = 6

[[case]]
name = "first cell"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=INDEX(A1:C3;1;1)"
expect = 1

[[case]]
name = "row out of range"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=INDEX(A1:C3;4;1)"
expect = "#REF!"

[[case]]
name = "column out of range"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=INDEX(A1:C3;1;4)"
expect = "#REF!"

[[case]]
name = "negative"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=INDEX(A1:C3;-1;1)"
expect = "#VALUE!"

[[case]]
name = "whole column in SUM"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=SUM(INDEX(A1:C3;0;2))"
expect = 15
note = "Row 0 selects the whole column; the result is a reference."

[[case]]
name = "whole row in SUM"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=SUM(INDEX(A1:C3;3;0))"
expect = 24

[[case]]
name = "whole range in SUM"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=SUM(INDEX(A1:C3;0;0))"
expect = 45

[[case]]
name = "row only on 2-D range"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=SUM(INDEX(A1:C3;2))"
expect = 15

[[case]]
name = "row only on single-row range"
cells = { A1 = 1, B1 = 2, C1 = 3 }
formula = "=INDEX(A1:C1;2)"
expect = 2

[[case]]
name = "single column"
cells = { A1 = 1, A2 = 2, A3 = 9 }
formula = "=INDEX(A1:A3;3)"
expect = 9

[[case]]
name = "empty cell picked"
cells = { A1 = 1 }
formula = "=ISBLANK(INDEX(A1:C3;2;2))"
expect = true

[[case]]
name = "area 1 accepted"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=INDEX(A1:C3;2;2;1)"
expect = 5

[[case]]
name = "area 2 unsupported"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=INDEX(A1:C3;2;2;2)"
expect = "#REF!"
note = "Multi-area references are not supported."

[[case]]
name = "error argument propagates"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=INDEX(A1:C3;1/0;1)"
expect = "#DIV/0!"

[[case]]
name = "inline array"
formula = "=INDEX({1;2|3;4};2;1)"
expect = 3

[[case]]
name = "missing row selects column"
cells = { A1 = 1, B1 = 2, C1 = 3, A2 = 4, B2 = 5, C2 = 6, A3 = 7, B3 = 8, C3 = 9 }
formula = "=SUM(INDEX(A1:C3;;3))"
expect = 18

[[case]]
name = "no row or column on 1x1"
cells = { A1 = 1 }
formula = "=INDEX(A1;1;1)"
expect = 1

[[case]]
name = "too few arguments"
formula = "=INDEX()"
expect = "Err:511"
