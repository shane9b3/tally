[[case]]
formula = "=SHEETS()"
expect = 1

[[case]]
cells = { A1 = 1, "Sheet2.A1" = 2, "Sheet2.B2" = 3 }
formula = "=SHEETS()"
expect = 2

[[case]]
cells = { A1 = 1, "Sheet2.A1" = 2, "Sheet2.B2" = 3 }
formula = "=SHEETS(A1)"
expect = 1

[[case]]
cells = { A1 = 1, "Sheet2.A1" = 2, "Sheet2.B2" = 3 }
formula = "=SHEETS(A1:C5)"
expect = 1

[[case]]
cells = { A1 = 1, "Sheet2.A1" = 2, "Sheet2.B2" = 3 }
formula = "=SHEETS(Sheet2.A1:B2)"
expect = 1
note = "A 2D reference spans one sheet."

[[case]]
formula = "=SHEETS(5)"
expect = "#VALUE!"

[[case]]
formula = "=SHEETS(\"x\")"
expect = "#VALUE!"

[[case]]
formula = "=SHEETS(1/0)"
expect = "#DIV/0!"

[[case]]
formula = "=SHEETS(A1;B1)"
expect = "Err:504"

[[case]]
cells = { A1 = 1, "Sheet2.A1" = 2, "Sheet2.B2" = 3 }
formula = "=SHEETS()+1"
expect = 3

[[case]]
name = "3D reference"
cells = { A1 = 10, "Sheet2.A1" = 20, "Sheet2.A2" = "t", "Sheet3.A1" = 30, "Sheet4.A1" = 40 }
formula = "=SHEETS(Sheet2.A1:Sheet4.A2)"
expect = 3
