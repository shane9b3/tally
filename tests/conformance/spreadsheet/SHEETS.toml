[[case]]
formula = "=SHEETS()"
expect = 1

[[case]]
cells = { A1 = 1, "Sheet2.A1" = 2, "Sheet2.B2" = 3 }
formula = "=SHEETS()"
expect = 2

[[case]]
cells = { A1 = 1, "Sheet2.A1" = 2, "Sheet2.B2" = 3 }
formula = "=SHEETS(A1)"
expect = 1

[[case]]
cells = { A1 = 1, "Sheet2.A1" = 2, "Sheet2.B2" = 3 }
formula = "=SHEETS(A1:C5)"
expect = 1

[[case]]
cells = { A1 = 1, "Sheet2.A1" = 2, "Sheet2.B2" = 3 }
formula = "=SHEETS(Sheet2.A1:B2)"
expect = 1
note = "3D references are not supported; a reference spans one sheet."

[[case]]
formula = "=SHEETS(5)"
expect = "#VALUE!"

[[case]]
formula = "=SHEETS(\"x\")"
expect = "#VALUE!"

[[case]]
formula = "=SHEETS(1/0)"
expect = "#DIV/0!"

[[case]]
formula = "=SHEETS(A1;B1)"
expect = "Err:504"

[[case]]
cells = { A1 = 1, "Sheet2.A1" = 2, "Sheet2.B2" = 3 }
formula = "=SHEETS()+1"
expect = 3
