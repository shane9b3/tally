# MATCH conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "default type largest le"
cells = { A1 = 1, A2 = 3, A3 = 5, A4 = 7 }
formula = "=MATCH(6;A1:A4)"
expect = 3

[[case]]
name = "type 1 exact"
cells = { A1 = 1, A2 = 3, A3 = 5, A4 = 7 }
formula = "=MATCH(7;A1:A4;1)"
expect = 4

[[case]]
name = "type 1 below first"
cells = { A1 = 1, A2 = 3, A3 = 5, A4 = 7 }
formula = "=MATCH(0;A1:A4)"
expect = "#N/A"

[[case]]
name = "type 0 hit"
cells = { A1 = 1, A2 = 3, A3 = 5, A4 = 7 }
formula = "=MATCH(5;A1:A4;0)"
expect = 3

[[case]]
name = "type 0 miss"
cells = { A1 = 1, A2 = 3, A3 = 5, A4 = 7 }
formula = "=MATCH(6;A1:A4;0)"
expect = "#N/A"

[[case]]
name = "type -1 descending"
cells = { A1 = 9, A2 = 6, A3 = 2 }
formula = "=MATCH(5;A1:A3;-1)"
expect = 2

[[case]]
name = "text exact case-insensitive"
cells = { A1 = "apple", A2 = "Banana", A3 = "cherry" }
formula = "=MATCH(\"BANANA\";A1:A3;0)"
expect = 2

[[case]]
name = "text wildcard"
cells = { A1 = "apple", A2 = "Banana", A3 = "cherry" }
formula = "=MATCH(\"ch*\";A1:A3;0)"
expect = 3

[[case]]
name = "text wildcard literal mode"
cells = { A1 = "apple", A2 = "cherry", A3 = "ch*x" }
formula = "=MATCH(\"ch*\";A1:A3;0)"
expect = "#N/A"
settings = { criteria_mode = "literal" }

[[case]]
name = "number never matches text"
cells = { A1 = "1", A2 = "x" }
formula = "=MATCH(1;A1:A2;0)"
expect = "#N/A"

[[case]]
name = "empty cells skipped but counted"
cells = { A1 = 1, A3 = 3 }
formula = "=MATCH(3;A1:A4;0)"
expect = 3

[[case]]
name = "row vector"
cells = { A1 = 10, B1 = 20, C1 = 30 }
formula = "=MATCH(20;A1:C1;0)"
expect = 2

[[case]]
name = "two-dimensional range"
cells = { A1 = 1, B2 = 2 }
formula = "=MATCH(1;A1:B2;0)"
expect = "Err:504"
note = "AOO ScMatch calls PushIllegalParameter() for a 2-D range (correctness review M8)."

[[case]]
name = "error lookup"
cells = { A1 = 1, A2 = 3, A3 = 5, A4 = 7 }
formula = "=MATCH(1/0;A1:A4)"
expect = "#DIV/0!"

[[case]]
name = "inline array"
formula = "=MATCH(2;{1;2;3};0)"
expect = 2

[[case]]
name = "sorted stops at first larger"
cells = { A1 = 1, A2 = 3, A3 = 10, A4 = 2, A5 = 4 }
formula = "=MATCH(4;A1:A5)"
expect = 2
