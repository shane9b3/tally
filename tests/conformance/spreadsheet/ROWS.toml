[[case]]
formula = "=ROWS(A1:C5)"
expect = 5

[[case]]
formula = "=ROWS(A1)"
expect = 1

[[case]]
formula = "=ROWS(B2:B3)"
expect = 2

[[case]]
formula = "=ROWS({1;2;3|4;5;6})"
expect = 2

[[case]]
formula = "=ROWS({1;2;3})"
expect = 1

[[case]]
formula = "=ROWS(5)"
expect = 1

[[case]]
formula = "=ROWS(\"text\")"
expect = 1

[[case]]
cells = { A2 = "=1/0" }
formula = "=ROWS(A1:A3)"
expect = 3
note = "Contents are irrelevant."

[[case]]
formula = "=ROWS()"
expect = "Err:511"

[[case]]
formula = "=ROWS(OFFSET(A1;0;0;4;2))"
expect = 4

[[case]]
formula = "=ROWS(1/0)"
expect = "#DIV/0!"

[[case]]
name = "3D reference: rows times sheets"
cells = { A1 = 10, "Sheet2.A1" = 20, "Sheet2.A2" = "t", "Sheet3.A1" = 30, "Sheet4.A1" = 40 }
formula = "=ROWS(Sheet1.A1:Sheet3.A2)"
expect = 6
