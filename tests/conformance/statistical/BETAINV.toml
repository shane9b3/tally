# BETAINV conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "median"
formula = "=BETAINV(0.5;2;3)"
expect = 0.38572756813238956
tol = 4e-14

[[case]]
name = "scaled"
formula = "=BETAINV(0.6875;2;3;1;3)"
expect = 2.0
tol = 2e-13

[[case]]
name = "arcsine"
formula = "=BETAINV(0.001;0.5;0.5)"
expect = 2.467399070916944e-06
tol = 2e-17

[[case]]
name = "uniform"
formula = "=BETAINV(0.5;1;1)"
expect = 0.5
tol = 5e-14

[[case]]
name = "p = 0"
formula = "=BETAINV(0;2;3)"
expect = 0
tol = 0
note = "AOO pushes 0 (not Start) for p = 0."

[[case]]
name = "p = 1"
formula = "=BETAINV(1;2;3)"
expect = "Err:502"

[[case]]
name = "start = end"
formula = "=BETAINV(0.5;2;3;1;1)"
expect = "Err:502"

[[case]]
name = "alpha negative"
formula = "=BETAINV(0.5;-1;3)"
expect = "Err:502"

[[case]]
name = "text"
formula = "=BETAINV(\"x\";2;3)"
expect = "#VALUE!"
