# B conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "mass"
formula = "=B(10;0.5;3)"
expect = 0.1171875
tol = 1e-14

[[case]]
name = "range"
formula = "=B(10;0.5;0;3)"
expect = 0.171875
tol = 2e-14

[[case]]
name = "degenerate range"
formula = "=B(10;0.5;3;3)"
expect = 0.1171875
tol = 1e-14

[[case]]
name = "large n range"
formula = "=B(2000;0.25;400;600)"
expect = 0.9999997667042623
tol = 1e-12

[[case]]
name = "p = 0"
formula = "=B(10;0;0)"
expect = 1.0
tol = 0

[[case]]
name = "p = 1"
formula = "=B(10;1;10)"
expect = 1.0
tol = 0

[[case]]
name = "x > n"
formula = "=B(10;0.5;11)"
expect = "Err:502"

[[case]]
name = "p > 1"
formula = "=B(10;1.5;3)"
expect = "Err:502"

[[case]]
name = "reversed range"
formula = "=B(10;0.5;4;3)"
expect = "Err:502"

[[case]]
name = "empty t_2 is 0"
formula = "=B(10;0.5;3;)"
expect = "Err:502"
note = "AOO counts a written but empty argument, which reads as 0/FALSE (GetDouble on svMissing)."

[[case]]
name = "text"
formula = "=B(\"x\";0.5;3)"
expect = "#VALUE!"
