# TRIMMEAN conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 4, A2 = 5, A3 = 6, A4 = 7, A5 = 2, A6 = 3, A7 = 4, A8 = 5, A9 = 1, A10 = 2, A11 = 3, A12 = 100 }
formula = "=TRIMMEAN(A1:A12;0.2)"
expect = 4.1
tol = 1e-12

[[case]]
name = "alpha 0 trims nothing"
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
formula = "=TRIMMEAN(A1:A8;0)"
expect = 5
tol = 1e-12

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
formula = "=TRIMMEAN(A1:A8;0.5)"
expect = 4.5
tol = 1e-12

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
formula = "=TRIMMEAN(A1:A8;0.25)"
expect = 4.833333333333333
tol = 1e-12

[[case]]
name = "floor(8*0.1/2)=0 pairs trimmed"
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
formula = "=TRIMMEAN(A1:A8;0.1)"
expect = 5
tol = 1e-12

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
formula = "=TRIMMEAN(A1:A8;1)"
expect = "Err:502"

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
formula = "=TRIMMEAN(A1:A8;-0.1)"
expect = "Err:502"

[[case]]
name = "unsorted input"
cells = { A1 = 9, A2 = 2, A3 = 3, A4 = 4, A5 = 5 }
formula = "=TRIMMEAN(A1:A5;0.4)"
expect = 4.0
tol = 1e-12

[[case]]
name = "inline array"
formula = "=TRIMMEAN({1;3;4;100};0.5)"
expect = 3.5
tol = 1e-12

[[case]]
name = "no numbers"
cells = { A1 = "x" }
formula = "=TRIMMEAN(A1:A3;0.2)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=NA()" }
formula = "=TRIMMEAN(A1:A3;0.2)"
expect = "#N/A"

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
