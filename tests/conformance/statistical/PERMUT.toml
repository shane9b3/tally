# PERMUT conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=PERMUT(5;2)"
expect = 20

[[case]]
formula = "=PERMUT(5;5)"
expect = 120

[[case]]
formula = "=PERMUT(5;0)"
expect = 1

[[case]]
formula = "=PERMUT(0;0)"
expect = 1

[[case]]
formula = "=PERMUT(10;3)"
expect = 720

[[case]]
name = "arguments truncated"
formula = "=PERMUT(5.9;2.9)"
expect = 20

[[case]]
formula = "=PERMUT(2;3)"
expect = "Err:502"
note = "k greater than n; Excel gives #NUM!."

[[case]]
formula = "=PERMUT(-1;0)"
expect = "Err:502"

[[case]]
formula = "=PERMUT(5;-1)"
expect = "Err:502"

[[case]]
name = "error propagates"
cells = { A1 = "=1/0", A2 = 2 }
formula = "=PERMUT(A1;A2)"
expect = "#DIV/0!"

[[case]]
formula = "=PERMUT(\"x\";2)"
expect = "#VALUE!"

[[case]]
formula = "=PERMUT(5)"
expect = "Err:511"
