# DEVSQ conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 4, A2 = 5, A3 = 8, A4 = 7, A5 = 11, A6 = 4, A7 = 3 }
formula = "=DEVSQ(A1:A7)"
expect = 48.0
tol = 1e-12

[[case]]
formula = "=DEVSQ(1;2;3;4;5)"
expect = 10.0
tol = 1e-12

[[case]]
name = "text skipped"
cells = { A1 = 1, A2 = "x", A3 = 3 }
formula = "=DEVSQ(A1:A3)"
expect = 2.0
tol = 1e-12

[[case]]
name = "booleans count as numbers"
cells = { A1 = 0, A2 = true }
formula = "=DEVSQ(A1:A2)"
expect = 0.5
tol = 1e-12

[[case]]
formula = "=DEVSQ(5)"
expect = 0.0
tol = 1e-12

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=NA()", A3 = 3 }
formula = "=DEVSQ(A1:A3)"
expect = "#N/A"

[[case]]
name = "no numbers"
cells = { A1 = "x" }
formula = "=DEVSQ(A1:A2)"
expect = "#VALUE!"

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
formula = "=DEVSQ(A1:A8)"
expect = 32.0
tol = 1e-12

[[case]]
name = "large offset stays accurate"
formula = "=DEVSQ(1000000001;1000000002;1000000003)"
expect = 2.0
tol = 1e-12

[[case]]
formula = "=DEVSQ()"
expect = "Err:511"
