# KURT conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 2, A5 = 3, A6 = 4, A7 = 5, A8 = 6, A9 = 4, A10 = 7 }
formula = "=KURT(A1:A10)"
expect = -0.15179963720841272
tol = 1e-12

[[case]]
formula = "=KURT(3;4;5;2;3;4;5;6;4;7)"
expect = -0.15179963720841272
tol = 1e-12

[[case]]
formula = "=KURT(1;2;3;4;5)"
expect = -1.2
tol = 1e-12

[[case]]
formula = "=KURT(1;2;3;10)"
expect = 3.2279999999999944
tol = 1e-12

[[case]]
formula = "=KURT(1;2;3)"
expect = "#DIV/0!"
note = "Fewer than 4 values gives #DIV/0!."

[[case]]
formula = "=KURT(2;2;2;2)"
expect = "#DIV/0!"
note = "Zero standard deviation gives #DIV/0!."

[[case]]
name = "text skipped"
cells = { A1 = 1, A2 = 2, A3 = "x", A4 = 3, A5 = 4 }
formula = "=KURT(A1:A5)"
expect = -1.1999999999999975
tol = 1e-12

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = 2, A3 = "=NA()", A4 = 3, A5 = 4 }
formula = "=KURT(A1:A5)"
expect = "#N/A"

[[case]]
name = "no numbers"
cells = { A1 = "x" }
formula = "=KURT(A1:A2)"
expect = "#DIV/0!"

[[case]]
formula = "=KURT()"
expect = "Err:511"
