# RANK conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "descending by default"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=RANK(4;A1:A9)"
expect = 4

[[case]]
name = "ascending"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=RANK(4;A1:A9;1)"
expect = 5

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=RANK(9;A1:A9)"
expect = 1

[[case]]
name = "ties share the best rank"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=RANK(1;A1:A9)"
expect = 7

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=RANK(1;A1:A9;1)"
expect = 1

[[case]]
name = "value not present"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=RANK(7;A1:A9)"
expect = "#N/A"

[[case]]
name = "order 0 is descending"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=RANK(4;A1:A9;0)"
expect = 4

[[case]]
formula = "=RANK(2;{5;2;9};1)"
expect = 1

[[case]]
name = "empty value is 0, not present"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=RANK(A10;A1:A9)"
expect = "#N/A"

[[case]]
name = "error propagates"
cells = { A1 = 3, A2 = "=1/0" }
formula = "=RANK(3;A1:A3)"
expect = "#DIV/0!"

[[case]]
name = "booleans count as numbers"
cells = { A1 = true, A2 = 0 }
formula = "=RANK(1;A1:A2)"
expect = 1

[[case]]
formula = "=RANK(1)"
expect = "Err:511"
