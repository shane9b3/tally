# ZTEST conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "sample sigma"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13 }
formula = "=ZTEST(A1:A5;4)"
expect = 0.059977421014579924
tol = 6e-15

[[case]]
name = "given sigma"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13 }
formula = "=ZTEST(A1:A5;4;2)"
expect = 0.022085672454221307
tol = 2e-15

[[case]]
name = "inline array"
formula = "=ZTEST({1;2;3;4;5};2)"
expect = 0.07864960352514257
tol = 8e-15

[[case]]
name = "text skipped"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13, A6 = "x" }
formula = "=ZTEST(A1:A6;4)"
expect = 0.059977421014579924
tol = 6e-15

[[case]]
name = "sigma zero"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13 }
formula = "=ZTEST(A1:A5;4;0)"
expect = "Err:502"

[[case]]
name = "empty sigma is 0"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13 }
formula = "=ZTEST(A1:A5;4;)"
expect = "Err:502"
note = "AOO counts a written but empty argument, which reads as 0/FALSE (GetDouble on svMissing)."

[[case]]
name = "one value"
formula = "=ZTEST(5;1)"
expect = "#DIV/0!"

[[case]]
name = "text data"
formula = "=ZTEST(\"x\";1)"
expect = "Err:504"
note = "AOO ScZTest: a string operand is an illegal parameter."

[[case]]
name = "error cell"
cells = { A1 = 3, A2 = "=1/0", A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13 }
formula = "=ZTEST(A1:A5;4)"
expect = "#DIV/0!"

[[case]]
name = "text mu"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13 }
formula = "=ZTEST(A1:A5;\"x\")"
expect = "#VALUE!"
