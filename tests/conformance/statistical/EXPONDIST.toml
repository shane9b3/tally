# EXPONDIST conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "cdf"
formula = "=EXPONDIST(1;1;TRUE)"
expect = 0.6321205588285577
tol = 6e-14

[[case]]
name = "pdf"
formula = "=EXPONDIST(1;1;FALSE)"
expect = 0.36787944117144233
tol = 4e-14

[[case]]
name = "rate 2"
formula = "=EXPONDIST(0.5;2;TRUE)"
expect = 0.6321205588285577
tol = 6e-14

[[case]]
name = "pdf at 0"
formula = "=EXPONDIST(0;2;0)"
expect = 2.0
tol = 0

[[case]]
name = "negative x cdf"
formula = "=EXPONDIST(-1;1;1)"
expect = 0
tol = 0

[[case]]
name = "negative x pdf"
formula = "=EXPONDIST(-1;1;0)"
expect = 0
tol = 0

[[case]]
name = "lambda zero"
formula = "=EXPONDIST(1;0;1)"
expect = "Err:502"

[[case]]
name = "text"
formula = "=EXPONDIST(\"x\";1;1)"
expect = "#VALUE!"

[[case]]
name = "small x"
formula = "=EXPONDIST(1E-10;1;TRUE)"
expect = 9.9999999995e-11
tol = 1e-24

[[case]]
name = "too few"
formula = "=EXPONDIST(1;1)"
expect = "Err:511"
