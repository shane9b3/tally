# RSQ conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=RSQ(A1:A5;B1:B5)"
expect = 0.6000000000000001
tol = 1e-12

[[case]]
name = "symmetric"
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=RSQ(B1:B5;A1:A5)"
expect = 0.6000000000000001
tol = 1e-12

[[case]]
cells = { A1 = 10, A2 = 20, A3 = 25, A4 = 40, A5 = 41, A6 = 60, B1 = 1, B2 = 2, B3 = 3, B4 = 5, B5 = 6, B6 = 9 }
formula = "=RSQ(A1:A6;B1:B6)"
expect = 0.9854869662561971
tol = 1e-12

[[case]]
name = "perfect fit"
cells = { B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5, C1 = 5, C2 = 4, C3 = 3, C4 = 2, C5 = 1 }
formula = "=RSQ(B1:B5;C1:C5)"
expect = 1.0
tol = 1e-12

[[case]]
name = "pair with text skipped"
cells = { A1 = 2, A2 = 4, A3 = "x", A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=RSQ(A1:A5;B1:B5)"
expect = 0.7578947368421053
tol = 1e-12

[[case]]
name = "different sizes"
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=RSQ(A1:A5;B1:B4)"
expect = "#N/A"

[[case]]
name = "zero variance"
cells = { A1 = 3, A2 = 3, A3 = 3, B1 = 1, B2 = 2, B3 = 3 }
formula = "=RSQ(A1:A3;B1:B3)"
expect = "#DIV/0!"

[[case]]
name = "single pair"
cells = { A1 = 1, B1 = 2 }
formula = "=RSQ(A1;B1)"
expect = "#DIV/0!"

[[case]]
formula = "=RSQ({1;2;3};{2;4;7})"
expect = 0.986842105263158
tol = 1e-12

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=RSQ(A1:A5)"
expect = "Err:511"
