# FTEST conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "columns"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13 }
formula = "=FTEST(A1:A5;B1:B5)"
expect = 0.7074508160343946
tol = 7e-14

[[case]]
name = "inline arrays"
formula = "=FTEST({1;2;3;4};{2;4;6;9;12})"
expect = 0.09488808237700358
tol = 9e-15

[[case]]
name = "different lengths"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13 }
formula = "=FTEST(A1:A5;B1:B3)"
expect = 0.2681327160493827
tol = 3e-14

[[case]]
name = "text skipped"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13, A6 = "x" }
formula = "=FTEST(A1:A6;B1:B5)"
expect = 0.7074508160343946
tol = 7e-14

[[case]]
name = "one value"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = 8, A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13 }
formula = "=FTEST(A1;B1:B5)"
expect = "#VALUE!"

[[case]]
name = "zero variance"
formula = "=FTEST({2;2;2};{1;2;3})"
expect = "#VALUE!"

[[case]]
name = "error cell"
cells = { A1 = 3, A2 = 4, A3 = 5, A4 = "=1/0", A5 = 9, B1 = 5, B2 = 7, B3 = 6, B4 = 9, B5 = 13 }
formula = "=FTEST(A1:A5;B1:B5)"
expect = "#DIV/0!"

[[case]]
name = "bool counts"
cells = { A1 = true, A2 = 3, A3 = 7, B1 = 5, B2 = 7, B3 = 6 }
formula = "=FTEST(A1:A3;B1:B3)"
expect = 0.1935483870967742
tol = 2e-14
