# TINV conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "0.05/10"
formula = "=TINV(0.05;10)"
expect = 2.228138851986275
tol = 2e-13

[[case]]
name = "tiny p"
formula = "=TINV(1E-10;3)"
expect = 2804.2938253395255
tol = 3e-09

[[case]]
name = "Cauchy"
formula = "=TINV(0.5;1)"
expect = 1.0
tol = 1e-13

[[case]]
name = "df floored"
formula = "=TINV(0.05;10.9)"
expect = 2.228138851986275
tol = 2e-13

[[case]]
name = "p = 1"
formula = "=TINV(1;10)"
expect = 0
tol = 0
note = "The bracket search reaches t = 0, where the two-tailed TDIST is 1."

[[case]]
name = "p = 0"
formula = "=TINV(0;10)"
expect = "Err:502"

[[case]]
name = "df zero"
formula = "=TINV(0.05;0)"
expect = "Err:502"

[[case]]
name = "df too large"
formula = "=TINV(0.05;100000)"
expect = "Err:502"

[[case]]
name = "text"
formula = "=TINV(\"x\";10)"
expect = "#VALUE!"
