# STANDARDIZE conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=STANDARDIZE(42;40;1.5)"
expect = 1.3333333333333333
tol = 1e-12

[[case]]
formula = "=STANDARDIZE(40;40;1.5)"
expect = 0.0
tol = 1e-12

[[case]]
formula = "=STANDARDIZE(0;1;2)"
expect = -0.5
tol = 1e-12

[[case]]
formula = "=STANDARDIZE(10;5;5)"
expect = 1.0
tol = 1e-12

[[case]]
formula = "=STANDARDIZE(1;1;0)"
expect = "Err:502"
note = "Non-positive standard deviation is Err:502 (AOO); LibreOffice gives #NUM!."

[[case]]
formula = "=STANDARDIZE(1;1;-2)"
expect = "Err:502"

[[case]]
name = "cell references"
cells = { A1 = 3, A2 = 1, A3 = 2 }
formula = "=STANDARDIZE(A1;A2;A3)"
expect = 1.0
tol = 1e-12

[[case]]
name = "error propagates"
cells = { A1 = "=1/0" }
formula = "=STANDARDIZE(A1;1;1)"
expect = "#DIV/0!"

[[case]]
formula = "=STANDARDIZE(\"x\";1;1)"
expect = "#VALUE!"

[[case]]
formula = "=STANDARDIZE(1;1)"
expect = "Err:511"

[[case]]
formula = "=STANDARDIZE(1;1;1;1)"
expect = "Err:504"
