# STDEV conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
formula = "=STDEV(A1:A8)"
expect = 2.138089935299395
tol = 1e-12

[[case]]
formula = "=STDEV(1;3;7)"
expect = 3.0550504633038935
tol = 1e-12

[[case]]
cells = { A1 = 1, A2 = 3, A3 = 7 }
formula = "=STDEV(A1:A3)"
expect = 3.0550504633038935
tol = 1e-12

[[case]]
name = "text skipped"
cells = { A1 = 1, A2 = "x", A3 = 3, A4 = 7 }
formula = "=STDEV(A1:A4)"
expect = 3.0550504633038935
tol = 1e-12

[[case]]
name = "boolean in reference counts as 1"
cells = { A1 = 1, A2 = true, A3 = 3 }
formula = "=STDEV(A1:A3)"
expect = 1.1547005383792517
tol = 1e-12

[[case]]
name = "empty cell skipped"
cells = { A1 = 1, A3 = 3 }
formula = "=STDEV(A1:A3)"
expect = 1.4142135623730951
tol = 1e-12

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=1/0", A3 = 3 }
formula = "=STDEV(A1:A3)"
expect = "#DIV/0!"

[[case]]
name = "large offset"
formula = "=STDEV(1e9+1;1e9+2;1e9+3)"
expect = 1.0
tol = 1e-06

[[case]]
formula = "=STDEV()"
expect = "Err:511"

[[case]]
formula = "=STDEV(5)"
expect = "#DIV/0!"
note = "One value: #DIV/0! (LibreOffice). AOO may report Err:502."

[[case]]
name = "no values"
formula = "=STDEV(A1:A3)"
expect = "#DIV/0!"
