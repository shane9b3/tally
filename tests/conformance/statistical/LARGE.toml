# LARGE conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=LARGE(A1:A9;1)"
expect = 9

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=LARGE(A1:A9;2)"
expect = 6

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=LARGE(A1:A9;8)"
expect = 1

[[case]]
name = "text skipped"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=LARGE(A1:A9;3)"
expect = 5

[[case]]
name = "k greater than count"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=LARGE(A1:A9;9)"
expect = "Err:502"

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=LARGE(A1:A9;0)"
expect = "Err:502"

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=LARGE(A1:A9;-1)"
expect = "Err:502"

[[case]]
formula = "=LARGE({1;5;3};2)"
expect = 3

[[case]]
name = "k truncated"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=LARGE(A1:A9;2.9)"
expect = 6

[[case]]
name = "empty data"
formula = "=LARGE(B1:B3;1)"
expect = "Err:502"

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=NA()", A3 = 3 }
formula = "=LARGE(A1:A3;1)"
expect = "#N/A"

[[case]]
name = "boolean counts as number"
cells = { A1 = true, A2 = "x" }
formula = "=LARGE(A1:A3;1)"
expect = 1

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=LARGE(A1:A9)"
expect = "Err:511"
