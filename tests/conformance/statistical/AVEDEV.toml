# AVEDEV conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 4, A2 = 5, A3 = 8, A4 = 7, A5 = 11, A6 = 4, A7 = 3 }
formula = "=AVEDEV(A1:A7)"
expect = 2.2857142857142856
tol = 1e-12

[[case]]
formula = "=AVEDEV(1;2;3;4;5)"
expect = 1.2
tol = 1e-12

[[case]]
name = "text skipped"
cells = { A1 = 1, A2 = "x", A3 = 3, A4 = 6 }
formula = "=AVEDEV(A1:A4)"
expect = 1.7777777777777777
tol = 1e-12

[[case]]
name = "booleans count as numbers"
cells = { A1 = 1, A2 = true, A3 = 0 }
formula = "=AVEDEV(A1:A3)"
expect = 0.4444444444444444
tol = 1e-12

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=1/0", A3 = 3 }
formula = "=AVEDEV(A1:A3)"
expect = "#DIV/0!"

[[case]]
name = "no numbers"
cells = { A1 = "x" }
formula = "=AVEDEV(A1:A2)"
expect = "#VALUE!"
note = "AOO/LibreOffice: NoValue."

[[case]]
formula = "=AVEDEV(7)"
expect = 0
tol = 1e-12

[[case]]
name = "numeric text direct argument"
formula = "=AVEDEV(\"3\";5)"
expect = 1.0
tol = 1e-12

[[case]]
name = "bad text direct argument"
formula = "=AVEDEV(\"x\";5)"
expect = "#VALUE!"

[[case]]
formula = "=AVEDEV()"
expect = "Err:511"
