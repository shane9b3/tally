# MAX conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "simple"
formula = "=MAX(3;1;2)"
expect = 3

[[case]]
name = "range skips text"
cells = { A1 = 3, A2 = "x", A3 = -2, A4 = 5 }
formula = "=MAX(A1:A4)"
expect = 5

[[case]]
name = "no numbers is 0"
cells = { A1 = "x" }
formula = "=MAX(A1)"
expect = 0
note = "AOO returns 0 when there are no numbers."

[[case]]
name = "all negative"
formula = "=MAX(-3;-2)"
expect = -2

[[case]]
name = "bool in reference counts"
cells = { A1 = true, A2 = -4 }
formula = "=MAX(A1:A2)"
expect = 1
note = "AOO stores booleans as numbers."

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=1/0" }
formula = "=MAX(A1:A2)"
expect = "#DIV/0!"

[[case]]
name = "text number direct"
formula = "=MAX(\"5\";2)"
expect = 5

[[case]]
name = "non-numeric direct text"
formula = "=MAX(\"x\")"
expect = "#VALUE!"

[[case]]
name = "two ranges"
cells = { A1 = 1, A2 = 2, B1 = 8 }
formula = "=MAX(A1:A2;B1:B2)"
expect = 8

[[case]]
name = "no arguments"
formula = "=MAX()"
expect = "Err:511"

[[case]]
name = "3D reference"
cells = { A1 = 10, "Sheet2.A1" = 20, "Sheet2.A2" = "t", "Sheet3.A1" = 30, "Sheet4.A1" = 40 }
formula = "=MAX(Sheet1.A1:Sheet4.A2)"
expect = 40
