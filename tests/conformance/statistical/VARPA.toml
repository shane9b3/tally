# VARPA conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
formula = "=VARPA(A1:A8)"
expect = 4.0
tol = 1e-12

[[case]]
formula = "=VARPA(1;3;7)"
expect = 6.222222222222222
tol = 1e-12

[[case]]
cells = { A1 = 1, A2 = 3, A3 = 7 }
formula = "=VARPA(A1:A3)"
expect = 6.222222222222222
tol = 1e-12

[[case]]
name = "text in reference counts as 0"
cells = { A1 = 1, A2 = "x", A3 = 3, A4 = 7 }
formula = "=VARPA(A1:A4)"
expect = 7.1875
tol = 1e-12

[[case]]
name = "boolean counts as 1"
cells = { A1 = 1, A2 = true, A3 = 3 }
formula = "=VARPA(A1:A3)"
expect = 0.888888888888889
tol = 1e-12

[[case]]
cells = { A1 = "a", A2 = "b", A3 = 6 }
formula = "=VARPA(A1:A3)"
expect = 8.0
tol = 1e-12

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=1/0", A3 = 3 }
formula = "=VARPA(A1:A3)"
expect = "#DIV/0!"

[[case]]
name = "large offset"
formula = "=VARPA(1e9+1;1e9+2;1e9+3)"
expect = 0.6666666666666666
tol = 1e-06

[[case]]
formula = "=VARPA()"
expect = "Err:511"

[[case]]
name = "single value is allowed"
formula = "=VARPA(5)"
expect = 0.0
tol = 1e-12

[[case]]
name = "no values"
formula = "=VARPA(A1:A3)"
expect = "#DIV/0!"
note = "AOO gives #DIV/0! (LibreOffice too)."
