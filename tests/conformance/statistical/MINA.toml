# MINA conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "text counts as 0"
cells = { A1 = 1, A2 = "x", A3 = true, A4 = 5 }
formula = "=MINA(A1:A4)"
expect = 0

[[case]]
name = "text 0 below positives"
cells = { A1 = 3, A2 = "x", A3 = 1 }
formula = "=MINA(A1:A3)"
expect = 0

[[case]]
formula = "=MINA(4;2;8)"
expect = 2

[[case]]
name = "empty cells ignored"
cells = { A1 = 3, A3 = 1 }
formula = "=MINA(A1:A3)"
expect = 1

[[case]]
name = "no values gives 0"
formula = "=MINA(A1:A3)"
expect = 0

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=1/0" }
formula = "=MINA(A1:A3)"
expect = "#DIV/0!"

[[case]]
cells = { A1 = 5, A2 = true }
formula = "=MINA(A1:A2;10)"
expect = 1

[[case]]
name = "numeric text direct"
formula = "=MINA(\"4\";2)"
expect = 2

[[case]]
name = "bad text direct"
formula = "=MINA(\"x\")"
expect = "#VALUE!"

[[case]]
cells = { A1 = true, A2 = false }
formula = "=MINA(A1:A2)"
expect = 0

[[case]]
formula = "=MINA()"
expect = "Err:511"
