# VARA conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 4, A4 = 4, A5 = 5, A6 = 5, A7 = 7, A8 = 9 }
formula = "=VARA(A1:A8)"
expect = 4.571428571428571
tol = 1e-12

[[case]]
formula = "=VARA(1;3;7)"
expect = 9.333333333333334
tol = 1e-12

[[case]]
cells = { A1 = 1, A2 = 3, A3 = 7 }
formula = "=VARA(A1:A3)"
expect = 9.333333333333334
tol = 1e-12

[[case]]
name = "text in reference counts as 0"
cells = { A1 = 1, A2 = "x", A3 = 3, A4 = 7 }
formula = "=VARA(A1:A4)"
expect = 9.583333333333334
tol = 1e-12

[[case]]
name = "boolean counts as 1"
cells = { A1 = 1, A2 = true, A3 = 3 }
formula = "=VARA(A1:A3)"
expect = 1.3333333333333335
tol = 1e-12

[[case]]
cells = { A1 = "a", A2 = "b", A3 = 6 }
formula = "=VARA(A1:A3)"
expect = 12.0
tol = 1e-12

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=1/0", A3 = 3 }
formula = "=VARA(A1:A3)"
expect = "#DIV/0!"

[[case]]
name = "large offset"
formula = "=VARA(1e9+1;1e9+2;1e9+3)"
expect = 1.0
tol = 1e-06

[[case]]
formula = "=VARA()"
expect = "Err:511"

[[case]]
formula = "=VARA(5)"
expect = "#DIV/0!"
note = "One value: #DIV/0! (LibreOffice). AOO may report Err:502."

[[case]]
name = "no values"
formula = "=VARA(A1:A3)"
expect = "#DIV/0!"
