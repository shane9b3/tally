# PERCENTILE conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=PERCENTILE(A1:A9;0)"
expect = 1

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=PERCENTILE(A1:A9;1)"
expect = 9

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=PERCENTILE(A1:A9;0.5)"
expect = 3.5
tol = 1e-12

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=PERCENTILE(A1:A9;0.25)"
expect = 1.75
tol = 1e-12

[[case]]
name = "linear interpolation"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=PERCENTILE(A1:A9;0.9)"
expect = 6.8999999999999995
tol = 1e-12

[[case]]
formula = "=PERCENTILE({1;2;3;4};0.3)"
expect = 1.9
tol = 1e-12

[[case]]
name = "single value"
formula = "=PERCENTILE(5;0.7)"
expect = 5
tol = 1e-12

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=PERCENTILE(A1:A9;1.1)"
expect = "Err:502"

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=PERCENTILE(A1:A9;-0.1)"
expect = "Err:502"

[[case]]
name = "empty data"
formula = "=PERCENTILE(B1:B3;0.5)"
expect = "Err:502"

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=NA()" }
formula = "=PERCENTILE(A1:A3;0.5)"
expect = "#N/A"

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=PERCENTILE(A1:A9)"
expect = "Err:511"
