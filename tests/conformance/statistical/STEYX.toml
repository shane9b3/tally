# STEYX conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=STEYX(A1:A5;B1:B5)"
expect = 0.8944271909999159
tol = 1e-12

[[case]]
cells = { A1 = 10, A2 = 20, A3 = 25, A4 = 40, A5 = 41, A6 = 60, B1 = 1, B2 = 2, B3 = 3, B4 = 5, B5 = 6, B6 = 9 }
formula = "=STEYX(A1:A6;B1:B6)"
expect = 2.4119095530943158
tol = 1e-12

[[case]]
name = "inline arrays"
formula = "=STEYX({1;2;4;3};{1;2;3;4})"
expect = 0.9486832980505138
tol = 1e-12

[[case]]
name = "perfect fit"
formula = "=STEYX({1;2;3};{1;2;3})"
expect = 0.0
tol = 1e-07

[[case]]
name = "pair with text skipped"
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = "x", B4 = 4, B5 = 5 }
formula = "=STEYX(A1:A5;B1:B5)"
expect = 0.758287544405155
tol = 1e-12

[[case]]
name = "different sizes"
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=STEYX(A1:A5;B1:B4)"
expect = "#N/A"

[[case]]
name = "fewer than 3 pairs"
cells = { A1 = 1, A2 = 2, B1 = 1, B2 = 2 }
formula = "=STEYX(A1:A2;B1:B2)"
expect = "#DIV/0!"

[[case]]
name = "zero variance of x"
cells = { A1 = 1, A2 = 2, A3 = 3, B1 = 4, B2 = 4, B3 = 4 }
formula = "=STEYX(A1:A3;B1:B3)"
expect = "#DIV/0!"

[[case]]
name = "empty"
formula = "=STEYX(A1:A3;B1:B3)"
expect = "#DIV/0!"

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=STEYX(A1:A5)"
expect = "Err:511"
