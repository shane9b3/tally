# GEOMEAN conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
formula = "=GEOMEAN(4;9)"
expect = 6.0
tol = 1e-12

[[case]]
cells = { A1 = 4, A2 = 5, A3 = 8, A4 = 7 }
formula = "=GEOMEAN(A1:A4)"
expect = 5.785015217038156
tol = 1e-12

[[case]]
formula = "=GEOMEAN(1;1;1)"
expect = 1.0
tol = 1e-12

[[case]]
formula = "=GEOMEAN(2;8;4)"
expect = 4.0
tol = 1e-12

[[case]]
name = "text skipped"
cells = { A1 = 1, A2 = "x", A3 = 4 }
formula = "=GEOMEAN(A1:A3)"
expect = 2.0
tol = 1e-12

[[case]]
formula = "=GEOMEAN(0;4)"
expect = "Err:502"
note = "Zero is invalid (Err:502); Excel gives #NUM!."

[[case]]
formula = "=GEOMEAN(-1;4)"
expect = "Err:502"

[[case]]
name = "no numbers"
cells = { A1 = "x" }
formula = "=GEOMEAN(A1:A2)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A1 = 3, A2 = "=1/0" }
formula = "=GEOMEAN(A1:A2)"
expect = "#DIV/0!"

[[case]]
formula = "=GEOMEAN()"
expect = "Err:511"
