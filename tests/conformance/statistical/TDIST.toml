# TDIST conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "two tails"
formula = "=TDIST(2;10;2)"
expect = 0.07338803477074037
tol = 7e-15

[[case]]
name = "one tail"
formula = "=TDIST(2;10;1)"
expect = 0.03669401738537018
tol = 4e-15

[[case]]
name = "Cauchy"
formula = "=TDIST(0.1;1;1)"
expect = 0.4682744825694464
tol = 5e-14

[[case]]
name = "zero"
formula = "=TDIST(0;10;1)"
expect = 0.5
tol = 5e-14

[[case]]
name = "negative t"
formula = "=TDIST(-1;10;1)"
expect = "Err:502"

[[case]]
name = "df zero"
formula = "=TDIST(2;0;1)"
expect = "Err:502"

[[case]]
name = "mode 3"
formula = "=TDIST(2;10;3)"
expect = "Err:502"

[[case]]
name = "mode floored"
formula = "=TDIST(2;10;1.5)"
expect = 0.03669401738537018
tol = 4e-15

[[case]]
name = "text"
formula = "=TDIST(\"x\";10;1)"
expect = "#VALUE!"

[[case]]
name = "too few"
formula = "=TDIST(2;10)"
expect = "Err:511"
