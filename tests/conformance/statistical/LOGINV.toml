# LOGINV conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "median"
formula = "=LOGINV(0.5;1;2)"
expect = 2.718281828459045
tol = 3e-13

[[case]]
name = "upper"
formula = "=LOGINV(0.975;0;1)"
expect = 7.099071384231333
tol = 7e-13

[[case]]
name = "lower"
formula = "=LOGINV(0.05;2;0.5)"
expect = 3.246486019165694
tol = 3e-13

[[case]]
name = "p = 0"
formula = "=LOGINV(0;0;1)"
expect = "Err:502"

[[case]]
name = "p = 1"
formula = "=LOGINV(1;0;1)"
expect = "Err:502"

[[case]]
name = "stdev zero"
formula = "=LOGINV(0.5;0;0)"
expect = "Err:502"

[[case]]
name = "text"
formula = "=LOGINV(\"x\";0;1)"
expect = "#VALUE!"

[[case]]
name = "bool p is 1"
cells = { A1 = true }
formula = "=LOGINV(A1;0;1)"
expect = "Err:502"
