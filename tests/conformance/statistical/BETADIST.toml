# BETADIST conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "cdf"
formula = "=BETADIST(0.5;2;3)"
expect = 0.6875
tol = 7e-14

[[case]]
name = "density"
formula = "=BETADIST(0.5;2;3;0;1;FALSE)"
expect = 1.5
tol = 2e-13

[[case]]
name = "scaled"
formula = "=BETADIST(2;2;3;1;3)"
expect = 0.6875
tol = 7e-14

[[case]]
name = "below start"
formula = "=BETADIST(-1;2;3)"
expect = 0
tol = 0

[[case]]
name = "above end"
formula = "=BETADIST(1.5;2;3)"
expect = 1.0
tol = 0

[[case]]
name = "large parameters"
formula = "=BETADIST(0.3;200;500)"
expect = 0.7996208251731606
tol = 8e-13

[[case]]
name = "uniform density"
formula = "=BETADIST(0.25;1;1;0;1;FALSE)"
expect = 1.0
tol = 0

[[case]]
name = "alpha zero"
formula = "=BETADIST(0.5;0;3)"
expect = "Err:502"

[[case]]
name = "empty range"
formula = "=BETADIST(0.5;2;3;1;1)"
expect = "Err:502"

[[case]]
name = "text"
formula = "=BETADIST(\"x\";2;3)"
expect = "#VALUE!"

[[case]]
name = "empty end is 0"
formula = "=BETADIST(0.5;2;3;;)"
expect = "Err:502"
note = "AOO counts a written but empty argument, which reads as 0/FALSE (GetDouble on svMissing). End = 0 gives a non-positive scale."
