# CORREL conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=CORREL(A1:A5;B1:B5)"
expect = 0.7745966692414834
tol = 1e-12

[[case]]
name = "symmetric"
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=CORREL(B1:B5;A1:A5)"
expect = 0.7745966692414834
tol = 1e-12

[[case]]
cells = { A1 = 10, A2 = 20, A3 = 25, A4 = 40, A5 = 41, A6 = 60, B1 = 1, B2 = 2, B3 = 3, B4 = 5, B5 = 6, B6 = 9 }
formula = "=CORREL(B1:B6;A1:A6)"
expect = 0.9927169618054267
tol = 1e-12

[[case]]
name = "perfect negative"
cells = { B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5, C1 = 5, C2 = 4, C3 = 3, C4 = 2, C5 = 1 }
formula = "=CORREL(B1:B5;C1:C5)"
expect = -1.0
tol = 1e-12

[[case]]
name = "pair with text skipped"
cells = { A1 = 2, A2 = 4, A3 = "x", A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=CORREL(A1:A5;B1:B5)"
expect = 0.870571500132014
tol = 1e-12

[[case]]
name = "different sizes"
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=CORREL(A1:A5;B1:B4)"
expect = "#N/A"
note = "AOO: NV."

[[case]]
name = "zero variance"
cells = { A1 = 3, A2 = 3, A3 = 3, B1 = 1, B2 = 2, B3 = 3 }
formula = "=CORREL(A1:A3;B1:B3)"
expect = "#DIV/0!"

[[case]]
name = "single pair"
cells = { A1 = 1, B1 = 2 }
formula = "=CORREL(A1;B1)"
expect = "#DIV/0!"

[[case]]
name = "empty"
formula = "=CORREL(A1:A3;B1:B3)"
expect = "#DIV/0!"

[[case]]
name = "inline arrays"
formula = "=CORREL({1;2;3};{2;4;7})"
expect = 0.9933992677987828
tol = 1e-12

[[case]]
name = "error pair skipped, leaving one pair"
cells = { A1 = 1, A2 = "=1/0", B1 = 1, B2 = 2 }
formula = "=CORREL(A1:A2;B1:B2)"
expect = "#DIV/0!"
note = "AOO/LibreOffice matrix semantics skip pairs with errors."

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=CORREL(A1:A5)"
expect = "Err:511"
