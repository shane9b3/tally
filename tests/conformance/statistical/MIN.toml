# MIN conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "simple"
formula = "=MIN(3;1;2)"
expect = 1

[[case]]
name = "range skips text"
cells = { A1 = 3, A2 = "x", A3 = -2, A4 = 5 }
formula = "=MIN(A1:A4)"
expect = -2

[[case]]
name = "no numbers is 0"
cells = { A1 = "x" }
formula = "=MIN(A1)"
expect = 0
note = "AOO returns 0 when there are no numbers."

[[case]]
name = "empty range is 0"
formula = "=MIN(B1:B3)"
expect = 0

[[case]]
name = "bool in reference counts as number"
cells = { A1 = true, A2 = 4 }
formula = "=MIN(A1:A2)"
expect = 1
note = "AOO stores booleans as numbers."

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=NA()" }
formula = "=MIN(A1:A2)"
expect = "#N/A"

[[case]]
name = "text number direct"
formula = "=MIN(\"5\";7)"
expect = 5

[[case]]
name = "non-numeric direct text"
formula = "=MIN(\"x\";7)"
expect = "#VALUE!"

[[case]]
name = "text number in reference skipped"
cells = { A1 = "5", A2 = 9 }
formula = "=MIN(A1:A2)"
expect = 9

[[case]]
name = "negative and zero"
formula = "=MIN(0;-0.5)"
expect = -0.5

[[case]]
name = "no arguments"
formula = "=MIN()"
expect = "Err:511"

[[case]]
name = "3D reference"
cells = { A1 = 10, "Sheet2.A1" = 20, "Sheet2.A2" = "t", "Sheet3.A1" = 30, "Sheet4.A1" = 40 }
formula = "=MIN(Sheet2.A1:Sheet4.A2)"
expect = 20
