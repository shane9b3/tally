# MEDIAN conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
name = "odd count"
formula = "=MEDIAN(5;1;3)"
expect = 3

[[case]]
name = "even count averages"
formula = "=MEDIAN(4;1;2;9)"
expect = 3.0

[[case]]
name = "range skips text and empties"
cells = { A1 = 5, A2 = "x", A3 = 1, A5 = 3 }
formula = "=MEDIAN(A1:A5)"
expect = 3

[[case]]
name = "no numbers"
cells = { A1 = "x" }
formula = "=MEDIAN(A1)"
expect = "#VALUE!"
note = "AOO ScMedian gives NoValue (#VALUE!); LibreOffice agrees."

[[case]]
name = "empty range"
formula = "=MEDIAN(B1:B3)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=1/0" }
formula = "=MEDIAN(A1:A2)"
expect = "#DIV/0!"

[[case]]
name = "bool in reference"
cells = { A1 = true, A2 = 0, A3 = 5 }
formula = "=MEDIAN(A1:A3)"
expect = 1
note = "Booleans are numbers in AOO."

[[case]]
name = "single value"
formula = "=MEDIAN(7)"
expect = 7

[[case]]
name = "negative numbers"
formula = "=MEDIAN(-1;-3;-2)"
expect = -2

[[case]]
name = "text number direct"
formula = "=MEDIAN(\"4\";2)"
expect = 3
