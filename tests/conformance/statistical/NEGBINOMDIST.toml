# NEGBINOMDIST conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "2/3/0.5"
formula = "=NEGBINOMDIST(2;3;0.5)"
expect = 0.1875
tol = 2e-14

[[case]]
name = "x = 0"
formula = "=NEGBINOMDIST(0;3;0.5)"
expect = 0.125
tol = 1e-14

[[case]]
name = "10/5/0.3"
formula = "=NEGBINOMDIST(10;5;0.3)"
expect = 0.068710126992507
tol = 7e-15

[[case]]
name = "p = 1"
formula = "=NEGBINOMDIST(2;3;1)"
expect = 0
tol = 0

[[case]]
name = "p = 0"
formula = "=NEGBINOMDIST(2;3;0)"
expect = 0
tol = 0

[[case]]
name = "x not floored"
formula = "=NEGBINOMDIST(1.5;3;0.5)"
expect = 0.1875
tol = 2e-14
note = "AOO ScNegBinomDist does not floor x: the product runs while i < x."

[[case]]
name = "negative x"
formula = "=NEGBINOMDIST(-1;3;0.5)"
expect = "Err:502"

[[case]]
name = "negative r"
formula = "=NEGBINOMDIST(2;-1;0.5)"
expect = "Err:502"

[[case]]
name = "p > 1"
formula = "=NEGBINOMDIST(2;3;1.5)"
expect = "Err:502"

[[case]]
name = "text"
formula = "=NEGBINOMDIST(\"x\";3;0.5)"
expect = "#VALUE!"
