# POISSON conformance vectors. Schema: docs/contributing-functions.md.
# Reference numbers computed independently with mpmath (50 digits).

[[case]]
name = "mass"
formula = "=POISSON(2;3;FALSE)"
expect = 0.22404180765538775
tol = 2e-14

[[case]]
name = "cumulative"
formula = "=POISSON(2;3;TRUE)"
expect = 0.42319008112684353
tol = 4e-14

[[case]]
name = "cumulative default"
formula = "=POISSON(2;3)"
expect = 0.42319008112684353
tol = 4e-14

[[case]]
name = "large mean"
formula = "=POISSON(1000;1000;TRUE)"
expect = 0.508409367168506
tol = 5e-13

[[case]]
name = "mean > 712 mass"
formula = "=POISSON(800;750;FALSE)"
expect = 0.002760991364371143
tol = 3e-14

[[case]]
name = "mean zero mass"
formula = "=POISSON(0;0;FALSE)"
expect = 0
tol = 0

[[case]]
name = "mean zero cumulative"
formula = "=POISSON(0;0;TRUE)"
expect = 1.0
tol = 0

[[case]]
name = "negative x"
formula = "=POISSON(-1;3)"
expect = "Err:502"

[[case]]
name = "negative mean"
formula = "=POISSON(2;-1)"
expect = "Err:502"

[[case]]
name = "x floored"
formula = "=POISSON(2.9;3;0)"
expect = 0.22404180765538775
tol = 2e-14

[[case]]
name = "text"
formula = "=POISSON(\"x\";3)"
expect = "#VALUE!"

[[case]]
name = "empty cumulative is FALSE"
formula = "=POISSON(2;3;)"
expect = 0.22404180765538775
tol = 2e-14
note = "AOO counts a written but empty argument, which reads as 0/FALSE (GetDouble on svMissing)."
