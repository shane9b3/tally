[[case]]
name = "k greater than count"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=SMALL(A1:A9;9)"
expect = "Err:502"

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=SMALL(A1:A9;0)"
expect = "Err:502"

[[case]]
formula = "=SMALL({4;2;8};2)"
expect = 4

[[case]]
name = "k truncated"
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=SMALL(A1:A9;1.9)"
expect = 1

[[case]]
name = "empty data"
formula = "=SMALL(B1:B3;1)"
expect = "Err:502"

[[case]]
name = "error propagates"
cells = { A1 = 1, A2 = "=1/0" }
formula = "=SMALL(A1:A3;1)"
expect = "#DIV/0!"

[[case]]
name = "boolean counts as 0"
cells = { A1 = false, A2 = 5 }
formula = "=SMALL(A1:A2;1)"
expect = 0

[[case]]
cells = { A1 = 3, A2 = 1, A3 = 4, A4 = 1, A5 = 5, A6 = 9, A7 = 2, A8 = 6, A9 = "text" }
formula = "=SMALL(A1:A9)"
expect = "Err:511"
