# COVAR conformance vectors. Schema: docs/contributing-functions.md.

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=COVAR(A1:A5;B1:B5)"
expect = 1.2
tol = 1e-12

[[case]]
name = "symmetric"
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=COVAR(B1:B5;A1:A5)"
expect = 1.2
tol = 1e-12

[[case]]
cells = { A1 = 10, A2 = 20, A3 = 25, A4 = 40, A5 = 41, A6 = 60, B1 = 1, B2 = 2, B3 = 3, B4 = 5, B5 = 6, B6 = 9 }
formula = "=COVAR(B1:B6;A1:A6)"
expect = 43.611111111111114
tol = 1e-12

[[case]]
name = "pair with text skipped; divides by pair count"
cells = { A1 = 2, A2 = 4, A3 = "x", A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=COVAR(A1:A5;B1:B5)"
expect = 1.5
tol = 1e-12

[[case]]
name = "population covariance of one pair is 0"
cells = { A1 = 1, B1 = 2 }
formula = "=COVAR(A1;B1)"
expect = 0.0
tol = 1e-12

[[case]]
name = "no pairs"
formula = "=COVAR(A1:A3;B1:B3)"
expect = "#DIV/0!"

[[case]]
name = "different sizes"
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=COVAR(A1:A5;B1:B4)"
expect = "#N/A"

[[case]]
name = "variance of 1,2,3 (population)"
formula = "=COVAR({1;2;3};{1;2;3})"
expect = 0.6666666666666666
tol = 1e-12

[[case]]
formula = "=COVAR({1;2;3};{3;2;1})"
expect = -0.6666666666666666
tol = 1e-12

[[case]]
cells = { A1 = 2, A2 = 4, A3 = 5, A4 = 4, A5 = 5, B1 = 1, B2 = 2, B3 = 3, B4 = 4, B5 = 5 }
formula = "=COVAR(A1:A5)"
expect = "Err:511"
