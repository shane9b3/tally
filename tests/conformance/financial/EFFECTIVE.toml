# EFFECTIVE conformance vectors. Ported AOO 4.1 semantics (interpr2.cxx). ODF/Excel name EFFECT.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=EFFECTIVE(0.0525;4)"
expect = 0.0535427
tol = 1e-07

[[case]]
formula = "=EFFECTIVE(0.1;12)"
expect = 0.104713067441297
tol = 1e-12

[[case]]
name = "periods are floored"
formula = "=EFFECTIVE(0.1;4.9)"
expect = 0.103812890625
tol = 1e-09

[[case]]
name = "one period"
formula = "=EFFECTIVE(0.1;1)"
expect = 0.1
tol = 1e-15

[[case]]
name = "rate must be positive"
formula = "=EFFECTIVE(0;4)"
expect = "Err:502"

[[case]]
name = "periods below 1"
formula = "=EFFECTIVE(0.1;0.5)"
expect = "Err:502"

[[case]]
name = "boolean periods"
cells = { A1 = true }
formula = "=EFFECTIVE(0.1;A1)"
expect = 0.1
tol = 1e-15

[[case]]
name = "non-numeric text"
formula = "=EFFECTIVE(\"x\";4)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=EFFECTIVE(A4;4)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=EFFECTIVE(0.1)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=EFFECTIVE(0.1;4;1)"
expect = "Err:504"
