# ISPMT conformance vectors. Ported AOO 4.1 semantics (interpr2.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=ISPMT(0.1/12;1;3*12;8000000)"
expect = -64814.8148148148
tol = 1e-07

[[case]]
name = "Excel reference, yearly"
formula = "=ISPMT(0.1;1;3;8000000)"
expect = -533333.333333333
tol = 1e-06

[[case]]
name = "period 0"
formula = "=ISPMT(0.1;0;3;1000)"
expect = -100

[[case]]
name = "last period"
formula = "=ISPMT(0.1;3;3;1000)"
expect = 0

[[case]]
name = "zero total periods"
formula = "=ISPMT(0.1;1;0;1000)"
expect = "#NUM!"

[[case]]
name = "empty rate"
formula = "=ISPMT(A5;1;3;1000)"
expect = 0

[[case]]
name = "non-numeric text"
formula = "=ISPMT(\"x\";1;3;1000)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=ISPMT(A4;1;3;1000)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=ISPMT(0.1;1;3)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=ISPMT(0.1;1;3;1000;1)"
expect = "Err:504"
