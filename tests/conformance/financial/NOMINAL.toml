# NOMINAL conformance vectors. Ported AOO 4.1 semantics (interpr2.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=NOMINAL(0.053543;4)"
expect = 0.0525
tol = 1e-06

[[case]]
name = "inverse of EFFECTIVE"
formula = "=NOMINAL(EFFECTIVE(0.08;12);12)"
expect = 0.08
tol = 1e-12

[[case]]
name = "periods are floored"
formula = "=NOMINAL(0.1;4.9)"
expect = 0.0964547563377804
tol = 1e-09

[[case]]
name = "one period"
formula = "=NOMINAL(0.1;1)"
expect = 0.1
tol = 1e-15

[[case]]
name = "rate must be positive"
formula = "=NOMINAL(-0.1;4)"
expect = "Err:502"

[[case]]
name = "periods below 1"
formula = "=NOMINAL(0.1;0)"
expect = "Err:502"

[[case]]
name = "decimal text is #VALUE! by default"
formula = "=NOMINAL(\"0.1\";2)"
expect = "#VALUE!"
note = "Default ConvertUnambiguous converts only integers, exponents and ISO 8601 dates/times (AOO interpr4.cxx ConvertStringToValue), so decimal text is #VALUE!."

[[case]]
name = "non-numeric text"
formula = "=NOMINAL(\"x\";4)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=NOMINAL(A4;4)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=NOMINAL(0.1)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=NOMINAL(0.1;4;1)"
expect = "Err:504"

[[case]]
name = "numeric text (convert_locale)"
formula = "=NOMINAL(\"0.1\";2)"
expect = 0.0976176963403033
tol = 1e-09
settings = { text_to_number = "convert_locale" }
