# SYD conformance vectors. Ported AOO 4.1 semantics (interpr2.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=SYD(30000;7500;10;1)"
expect = 4090.909090909
tol = 1e-08

[[case]]
name = "Excel reference, last year"
formula = "=SYD(30000;7500;10;10)"
expect = 409.090909091
tol = 1e-08

[[case]]
name = "fractional period"
formula = "=SYD(30000;7500;10;0.5)"
expect = 4295.45454545455
tol = 4.29545454545455e-09

[[case]]
name = "period after life"
formula = "=SYD(30000;7500;10;11)"
expect = 0

[[case]]
name = "zero life"
formula = "=SYD(30000;7500;0;1)"
expect = "#NUM!"

[[case]]
name = "numeric text"
formula = "=SYD(\"30000\";7500;10;1)"
expect = 4090.909090909
tol = 1e-08

[[case]]
name = "non-numeric text"
formula = "=SYD(\"x\";7500;10;1)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=SYD(A4;7500;10;1)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=SYD(30000;7500;10)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=SYD(30000;7500;10;1;1)"
expect = "Err:504"
