# CUMPRINC conformance vectors. Ported AOO 4.1 semantics (interpr2.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=CUMPRINC(0.09/12;30*12;125000;13;24;0)"
expect = -934.1071234
tol = 1e-06

[[case]]
name = "Excel reference, first month"
formula = "=CUMPRINC(0.09/12;30*12;125000;1;1;0)"
expect = -68.27827118
tol = 1e-07

[[case]]
name = "advance"
formula = "=CUMPRINC(0.09/12;360;125000;1;12;1)"
expect = -1778.16017175526
tol = 1.77816017175526e-09

[[case]]
name = "whole loan"
formula = "=CUMPRINC(0.09/12;360;125000;1;360;0)"
expect = -125000
tol = 1e-06

[[case]]
name = "rate must be positive"
formula = "=CUMPRINC(0;360;125000;1;12;0)"
expect = "Err:502"

[[case]]
name = "end beyond nper"
formula = "=CUMPRINC(0.01;360;125000;1;361;0)"
expect = "Err:502"

[[case]]
name = "nper must be positive"
formula = "=CUMPRINC(0.01;0;125000;1;1;0)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=CUMPRINC(\"x\";360;125000;1;12;0)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=CUMPRINC(A4;360;125000;1;12;0)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=CUMPRINC(0.01;360;125000;1;12)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=CUMPRINC(0.01;360;125000;1;12;0;1)"
expect = "Err:504"
