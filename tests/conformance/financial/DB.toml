# DB conformance vectors. Ported AOO 4.1 semantics (interpr2.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=DB(1000000;100000;6;1;7)"
expect = 186083.333333333
tol = 1e-06

[[case]]
name = "Excel reference 2"
formula = "=DB(1000000;100000;6;2;7)"
expect = 259639.416666667
tol = 1e-06

[[case]]
name = "Excel reference, final partial year"
formula = "=DB(1000000;100000;6;7;7)"
expect = 15845.0984731
tol = 1e-05

[[case]]
name = "month omitted is 12"
formula = "=DB(1000000;100000;6;1)"
expect = 319000
tol = 1e-06

[[case]]
name = "empty month slot is 0"
formula = "=DB(1000000;100000;6;1;)"
expect = "Err:502"
note = "AOO reads a written-but-empty argument as 0."

[[case]]
name = "month above 12"
formula = "=DB(1000000;100000;6;1;13)"
expect = "Err:502"

[[case]]
name = "salvage above cost"
formula = "=DB(1000000;2000000;6;1)"
expect = "Err:502"

[[case]]
name = "period beyond life + 1"
formula = "=DB(1000000;100000;6;8)"
expect = "Err:502"

[[case]]
name = "non-numeric text"
formula = "=DB(\"x\";100000;6;1)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=DB(A4;100000;6;1)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=DB(1000000;100000;6)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=DB(1000000;100000;6;1;1;1)"
expect = "Err:504"
