# DURATION conformance vectors. Ported AOO 4.1 semantics (interpr2.cxx). Built-in DURATION = periods needed (ODF/Excel PDURATION); the bond duration is DURATION_ADD.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel PDURATION reference"
formula = "=DURATION(0.025;2000;2200)"
expect = 3.85986616262266
tol = 1e-12

[[case]]
name = "rate 4%"
formula = "=DURATION(0.04;100;150)"
expect = 10.3380350715077
tol = 1e-09

[[case]]
name = "no growth needed"
formula = "=DURATION(0.1;100;100)"
expect = 0

[[case]]
name = "zero rate"
formula = "=DURATION(0;100;150)"
expect = "#NUM!"

[[case]]
name = "negative pv"
formula = "=DURATION(0.1;-100;150)"
expect = "#NUM!"

[[case]]
name = "target below pv gives negative periods"
formula = "=DURATION(0.1;100;50)"
expect = -7.27254089734171
tol = 1e-09

[[case]]
name = "non-numeric text"
formula = "=DURATION(\"x\";100;150)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=DURATION(A4;100;150)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=DURATION(0.1;100)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=DURATION(0.1;100;150;1)"
expect = "Err:504"
