# IPMT conformance vectors. Ported AOO 4.1 semantics (interpr2.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=IPMT(0.1/12;1;36;8000)"
expect = -66.6666666667
tol = 1e-09

[[case]]
name = "Excel reference, last year"
formula = "=IPMT(0.1;3;3;8000)"
expect = -292.447129909366
tol = 1e-09

[[case]]
name = "first period in advance has no interest"
formula = "=IPMT(0.1/12;1;36;8000;0;1)"
expect = 0

[[case]]
name = "advance"
formula = "=IPMT(0.1/12;5;36;8000;0;1)"
expect = -59.7065275848998
tol = 1e-09

[[case]]
name = "period below 1"
formula = "=IPMT(0.1/12;0;36;8000)"
expect = "Err:502"

[[case]]
name = "period beyond nper"
formula = "=IPMT(0.1/12;37;36;8000)"
expect = "Err:502"

[[case]]
name = "with future value"
formula = "=IPMT(0.1/12;2;36;8000;1000)"
expect = -64.8716276271289
tol = 1e-09

[[case]]
name = "non-numeric text"
formula = "=IPMT(\"x\";1;36;8000)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=IPMT(A4;1;36;8000)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=IPMT(0.01;1;36)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=IPMT(0.01;1;36;8000;1;1;1)"
expect = "Err:504"
