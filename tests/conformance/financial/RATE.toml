# RATE conformance vectors. Ported AOO 4.1 semantics (interpr2.cxx). Newton iteration (RateIteration), 150 steps, no convergence is Err:523.
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=RATE(4*12;-200;8000)"
expect = 0.0077014724882
tol = 1e-12

[[case]]
name = "Excel reference, annual"
formula = "=RATE(4*12;-200;8000)*12"
expect = 0.09241767
tol = 1e-08

[[case]]
name = "payments in advance"
formula = "=RATE(10;-100;1000;0;1)"
expect = 4.17387402722136e-11
tol = 1e-09

[[case]]
name = "explicit guess"
formula = "=RATE(10;-100;1000;0;0;0.5)"
expect = 1.87007176699481e-09
tol = 1e-09

[[case]]
name = "non-integer nper branch"
formula = "=RATE(10.5;-100;1000)"
expect = 0.00857961613558643
tol = 1e-09

[[case]]
name = "nper must be positive"
formula = "=RATE(0;-100;1000)"
expect = "Err:502"

[[case]]
name = "no convergence"
formula = "=RATE(10;100;1000)"
expect = "Err:523"

[[case]]
name = "empty guess slot is 0"
formula = "=RATE(10;-100;1000;;;)"
expect = 0
note = "AOO reads a written-but-empty guess as 0 (not the 0.1 default); from 0 the exact root 0 is found at once."

[[case]]
name = "non-numeric text"
formula = "=RATE(\"x\";-100;1000)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=RATE(A4;-100;1000)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=RATE(10;-100)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=RATE(10;-100;1000;1;1;1;1)"
expect = "Err:504"
