# PMT conformance vectors. Ported AOO 4.1 semantics (interpr2.cxx).
# Schema: docs/contributing-functions.md.

[[case]]
name = "Excel reference"
formula = "=PMT(0.08/12;10;10000)"
expect = -1037.03208935916
tol = 1e-09

[[case]]
name = "Excel reference, advance"
formula = "=PMT(0.08/12;10;10000;0;1)"
expect = -1030.16432717797
tol = 1e-09

[[case]]
name = "saving for a future value"
formula = "=PMT(0.06/12;18*12;0;50000)"
expect = -129.081160867991
tol = 1e-09

[[case]]
name = "zero rate"
formula = "=PMT(0;10;1000)"
expect = -100

[[case]]
name = "zero periods"
formula = "=PMT(0.1;0;1000)"
expect = "#NUM!"
note = "Division by zero inside a function is #NUM! (AOO errIllegalFPOperation)."

[[case]]
name = "empty fv slot"
formula = "=PMT(0.1;10;1000;;1)"
expect = -147.950358984101
tol = 1e-09

[[case]]
name = "empty cell pv"
formula = "=PMT(0.1;10;A5)"
expect = 0

[[case]]
name = "non-numeric text"
formula = "=PMT(\"x\";10;1000)"
expect = "#VALUE!"

[[case]]
name = "error propagates"
cells = { A4 = "=1/0" }
formula = "=PMT(A4;10;1000)"
expect = "#DIV/0!"

[[case]]
name = "too few arguments"
formula = "=PMT(0.1;10)"
expect = "Err:511"

[[case]]
name = "too many arguments"
formula = "=PMT(0.1;10;1000;1;1;1)"
expect = "Err:504"
