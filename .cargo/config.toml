# ts-rs writes TypeScript bindings when `cargo test` runs. Default the export
# directory to the bridge package so a bare `cargo test --workspace` does not
# litter `crates/*/bindings/`. An explicitly set TS_RS_EXPORT_DIR wins.
[env]
TS_RS_EXPORT_DIR = { value = "packages/bridge/src/generated", relative = true }

[alias]
xtask = "run --quiet -p xtask --"
