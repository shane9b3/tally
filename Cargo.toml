[workspace]
resolver = "2"
members = [
    "crates/tally-types",
    "crates/tally-model",
    "crates/tally-api",
    "crates/tally-formula",
    "crates/tally-numfmt",
    "crates/tally-functions",
    "crates/tally-l10n",
    "crates/tally-engine",
    "crates/tally-io-ods",
    "crates/tally-io-xlsx",
    "crates/tally-io-csv",
    "crates/tally-io-pdf",
    "crates/tally-io-xls",
    "crates/tally-io-html",
    "crates/tally-io-dbf",
    "crates/tally-assist",
    "crates/tally-cli",
    "crates/tally-macos-terminate",
    "apps/desktop/src-tauri",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

# Exact pins from docs/adr/0001-stack.md. Never `cargo add tauri` without a
# version: the unpinned default resolves to the 3.0 alpha.
[workspace.dependencies]
# Internal crates
tally-types = { path = "crates/tally-types", version = "0.1.0" }
tally-model = { path = "crates/tally-model", version = "0.1.0" }
tally-api = { path = "crates/tally-api", version = "0.1.0" }
tally-formula = { path = "crates/tally-formula", version = "0.1.0" }
tally-numfmt = { path = "crates/tally-numfmt", version = "0.1.0" }
tally-functions = { path = "crates/tally-functions", version = "0.1.0" }
tally-l10n = { path = "crates/tally-l10n", version = "0.1.0" }
tally-engine = { path = "crates/tally-engine", version = "0.1.0" }
tally-io-ods = { path = "crates/tally-io-ods", version = "0.1.0" }
tally-io-xlsx = { path = "crates/tally-io-xlsx", version = "0.1.0" }
tally-io-csv = { path = "crates/tally-io-csv", version = "0.1.0" }
tally-io-pdf = { path = "crates/tally-io-pdf", version = "0.1.0" }
tally-io-xls = { path = "crates/tally-io-xls", version = "0.1.0" }
tally-io-html = { path = "crates/tally-io-html", version = "0.1.0" }
tally-io-dbf = { path = "crates/tally-io-dbf", version = "0.1.0" }
tally-assist = { path = "crates/tally-assist", version = "0.1.0" }
tally-macos-terminate = { path = "crates/tally-macos-terminate", version = "0.1.0" }

# Desktop shell (used by apps/desktop/src-tauri from WP7 on)
tauri = "=2.12.4"
tauri-build = "=2.7.3"
tauri-plugin-dialog = "=2.8.3"
# macOS only: the window's "document edited" dot (`closing.rs`), through the
# safe objc2 bindings Tauri's own tao already links (same versions as Cargo.lock).
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
# O_NOFOLLOW / O_NONBLOCK constants for reading foreign lock files (tally-desktop doclock.rs; no unsafe).
libc = "=0.2.191"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
# macOS only, tally-macos-terminate: queue AppKit calls on the main run loop
# (`-[NSRunLoop performInModes:block:]`). Already linked by tao.
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
# ... and wake the main run loop after queuing (`CFRunLoopWakeUp`). Already linked by tao.
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFRunLoop"] }

# Libraries
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
ts-rs = "=12.0.1"
quick-xml = "=0.42.0"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
rust_xlsxwriter = { version = "=0.100.0", default-features = false }
csv = "=1.4.0"
encoding_rs = "=0.8.42"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
slotmap = "=1.1.1"
smallvec = "=1.16.3"
regex = "=1.13.1"
thiserror = "=2.0.21"

# Dev / test only
proptest = "=1.12.0"
insta = "=1.49.0"
criterion = "=0.8.2"
toml = "=1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
