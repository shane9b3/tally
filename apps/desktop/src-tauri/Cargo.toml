[package]
name = "tally-desktop"
description = "Tally desktop shell: Tauri 2 window, menu, dialogs and the DocumentService command bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tally_desktop"
path = "src/lib.rs"

[[bin]]
name = "tally-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
# Pinned in the root Cargo.toml (=2.12.4). Never `cargo add tauri` bare.
# `unstable`: the multi-webview API (several document webviews per window =
# tabs; windows.rs). It makes every webview a child webview, see docs/security.md.
tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-single-instance.workspace = true
# Auto-update (updater.rs): check, download, verify (minisign) and install in Rust.
tauri-plugin-updater.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tally-api.workspace = true
tally-types.workspace = true
tally-engine = { workspace = true, features = ["io"] }
tally-assist.workspace = true
tally-l10n.workspace = true
zip.workspace = true
# Local time in lock files (doclock.rs; `DD.MM.YYYY HH:MM`, as AOO).
chrono.workspace = true
# The installed-font list for the font pickers (fonts.rs; metadata only).
tally-io-pdf.workspace = true
# macOS: the Dock's Quit and log-out ask about unsaved changes too
# (closing.rs); the workspace's one crate allowed `unsafe`, see docs/security.md.
# Does nothing on the other platforms.
tally-macos-terminate.workspace = true

[target.'cfg(unix)'.dependencies]
# Open flags only (`O_NOFOLLOW | O_NONBLOCK` for foreign lock files, doclock.rs); no FFI calls.
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The red close button's "document edited" dot and native tabs off (native.rs); safe API only.
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true

[lints]
workspace = true

