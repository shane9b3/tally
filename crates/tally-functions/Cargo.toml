[package]
name = "tally-functions"
description = "Spreadsheet function registry, coercion, criteria and implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `mock::{MockEvalContext, MockArgs}` so other crates' tests (and this
# crate's integration tests) can drive functions without an engine.
test-support = []
# Adds `EvalValue::Union` (reference unions handed to one parameter).
# Transitional: off until the engine builds the variant for `~` instead of
# splitting unions into sequence arguments; see docs/functions/engine-hooks.md.
ref-union = []

[dependencies]
tally-types.workspace = true
tally-numfmt = { workspace = true }
regex.workspace = true
smallvec.workspace = true
thiserror.workspace = true
# `FunctionMeta` (Function Wizard metadata) is serializable.
serde.workspace = true

[dev-dependencies]
# Self dev-dependency: turns on `test-support` for the integration tests.
tally-functions = { workspace = true, features = ["test-support"] }
# Coverage check of the localized function-name tables against the registry.
tally-l10n.workspace = true
toml.workspace = true
proptest.workspace = true

[lints]
workspace = true
