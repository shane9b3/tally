[package]
name = "tally-engine"
description = "Workbook storage, dependency graph, recalculation, ops and undo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Wires the ODS and CSV readers/writers into `service::IoCodec`. Off by
# default so the engine builds while the IO crates are in progress; the CLI
# and the Tauri shell enable it.
io = [
    "dep:tally-io-ods",
    "dep:tally-io-csv",
    "dep:tally-io-xlsx",
    "dep:tally-io-xls",
    "dep:tally-io-html",
    "dep:tally-io-dbf",
    "dep:tally-io-xmlss",
    "dep:tally-io-sylk",
    "dep:tally-io-dif",
    "pdf",
]
# Print preview and PDF export through `tally-io-pdf` (krilla/hayro).
pdf = ["dep:tally-io-pdf"]

[dependencies]
tally-types.workspace = true
tally-model.workspace = true
tally-api.workspace = true
tally-formula.workspace = true
tally-functions = { workspace = true, features = ["ref-union"] }
tally-numfmt.workspace = true
tally-io-ods = { workspace = true, optional = true }
tally-io-csv = { workspace = true, optional = true }
tally-io-xlsx = { workspace = true, optional = true }
tally-io-xls = { workspace = true, optional = true }
tally-io-html = { workspace = true, optional = true }
tally-io-dbf = { workspace = true, optional = true }
tally-io-xmlss = { workspace = true, optional = true }
tally-io-sylk = { workspace = true, optional = true }
tally-io-dif = { workspace = true, optional = true }
tally-io-pdf = { workspace = true, optional = true }
slotmap.workspace = true
smallvec.workspace = true
thiserror.workspace = true
regex.workspace = true

[dev-dependencies]
tally-io-ods.workspace = true
# Builds XLSX packages (shared formulas) in the security tests.
zip.workspace = true
tally-functions = { workspace = true, features = ["test-support"] }
proptest.workspace = true
criterion.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[[bench]]
name = "recalc"
harness = false

[lints]
workspace = true
