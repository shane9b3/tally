[package]
name = "tally-engine"
description = "Workbook storage, dependency graph, recalculation, ops and undo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Wires the ODS and CSV readers/writers into `service::IoCodec`. Off by
# default so the engine builds while the IO crates are in progress; the CLI
# and the Tauri shell enable it.
io = ["dep:tally-io-ods", "dep:tally-io-csv"]

[dependencies]
tally-types.workspace = true
tally-model.workspace = true
tally-api.workspace = true
tally-formula.workspace = true
tally-functions.workspace = true
tally-numfmt.workspace = true
tally-io-ods = { workspace = true, optional = true }
tally-io-csv = { workspace = true, optional = true }
slotmap.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
tally-functions = { workspace = true, features = ["test-support"] }
proptest.workspace = true
criterion.workspace = true
serde.workspace = true
toml.workspace = true

[[bench]]
name = "recalc"
harness = false

[lints]
workspace = true
