[package]
name = "tally-io-pdf"
description = "PDF rendering of print jobs (krilla) and page rasterization (hayro)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Exact pins (docs/wave5-plan.md): krilla 0.8.2 (subsetting through its
# `subsetter` dependency, shaping through rustybuzz), krilla-svg 0.8.1 for
# chart SVGs, hayro 0.7.1 for previews, fontdb/ttf-parser for system fonts.
krilla = { version = "=0.8.2", default-features = false, features = ["simple-text", "raster-images"] }
krilla-svg = "=0.8.1"
hayro = "=0.7.1"
fontdb = "=0.23.0"
ttf-parser = "=0.25.1"
usvg = "=0.47.0"
thiserror.workspace = true

[dev-dependencies]
hayro-syntax = "=0.7.2"

[lints]
workspace = true
